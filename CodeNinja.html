<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💻 CodeNinja</title>
<style>
 :root{--bg:#0c0f1f;--line:#2c3354;--accent:#ffd23f;--accent2:#ff4d6d;--good:#3ddc84;--pur:#9b5de5;--ink:#eef1ff}
 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:'Trebuchet MS','Segoe UI',sans-serif;color:var(--ink);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:14px;background:radial-gradient(1200px 800px at 70% -10%, #232a52 0%, var(--bg) 55%)}
 .wrap{width:100%;max-width:760px}
 .panel{background:linear-gradient(180deg,#191e36,#12152a);border:2px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
 h1{font-size:32px;text-align:center;text-shadow:0 3px 0 #000,0 0 24px rgba(255,210,63,.35);margin-bottom:4px}
 h2{font-size:22px;text-align:center;margin-bottom:6px}
 .sub{text-align:center;color:#a6acd6;margin-bottom:16px;font-size:14px;line-height:1.5}
 .btn{margin-top:12px;width:100%;padding:14px;border:none;border-radius:13px;cursor:pointer;font-size:17px;font-weight:bold;font-family:inherit;color:#101;background:linear-gradient(180deg,var(--accent),#d6a800);box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .06s}
 .btn:active{transform:translateY(4px)} .btn.ghost{background:#222843;color:var(--ink)} .btn.green{background:linear-gradient(180deg,var(--good),#2fbf6e);color:#031}
 .btn.sm{width:auto;display:inline-block;padding:9px 15px;font-size:15px;margin:4px}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}@media(min-width:640px){.grid{grid-template-columns:1fr 1fr 1fr}}
 .tile{background:linear-gradient(180deg,#1c2342,#141831);border:2px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;text-align:center;transition:transform .12s,border-color .15s;position:relative}
 .tile:hover{transform:translateY(-4px);border-color:var(--accent)}
 .tile .em{font-size:36px}.tile b{display:block;font-size:14px;margin-top:6px}.tile .pct{position:absolute;top:6px;right:9px;font-size:11px;font-weight:bold;color:var(--good)}
 .tag{font-size:12px;font-weight:bold;padding:5px 12px;border-radius:999px;background:#1c2342;border:1px solid var(--line);color:var(--accent)}
 .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
 .cat{display:inline-block;font-size:12px;font-weight:bold;padding:5px 12px;border-radius:999px;background:var(--pur);color:#fff;margin-bottom:10px}
 .q{font-size:20px;font-weight:bold;line-height:1.35;margin:8px 0 12px}
 .opts{display:grid;gap:10px}
 .opt{text-align:left;padding:13px 15px;border-radius:12px;border:2px solid var(--line);background:#1c2342;color:var(--ink);font-size:16px;cursor:pointer;font-family:inherit;transition:transform .08s,background .12s}
 .opt:hover{background:#26305a;transform:translateY(-2px)}
 .opt.correct{background:var(--good);color:#031;border-color:#2fbf6e;font-weight:bold}.opt.wrong{background:var(--accent2);color:#fff;font-weight:bold}.opt.dim{opacity:.4}
 .explain{margin-top:12px;background:#11152a;border-left:5px solid var(--accent);border-radius:10px;padding:12px;font-size:15px;line-height:1.5;color:#dde2ff;display:none}.explain b{color:var(--accent)}
 .hud{display:flex;gap:10px;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
 .stat{flex:1;min-width:74px;background:#11152a;border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:#a6acd6;text-transform:uppercase}
 .streak.fire b{color:var(--accent);text-shadow:0 0 12px var(--accent)}
 .bar{height:10px;background:#11152a;border-radius:8px;overflow:hidden;border:2px solid var(--line);margin-bottom:14px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));width:0;transition:width .35s}
 .fighter{display:flex;align-items:center;gap:12px;margin-bottom:10px}.fighter .face{font-size:40px;width:52px;text-align:center;flex:none}
 .nm{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}.hpbar{height:15px;background:#11152a;border-radius:9px;overflow:hidden;border:2px solid var(--line)}.hpbar>i{display:block;height:100%;transition:width .4s}
 .hp-e>i{background:linear-gradient(90deg,#d62f4d,#ff7d99)}.hp-s>i{background:linear-gradient(90deg,#2fbf6e,#5dffa0)}
 .bubble{background:#11152a;border:2px solid var(--line);border-radius:13px;padding:10px 13px;font-size:13.5px;color:#dde2ff;margin:8px 0;font-style:italic}
 .info{background:#11152a;border:2px solid var(--line);border-radius:12px;padding:13px;font-size:14.5px;line-height:1.55}.info b{color:var(--accent)}
 .center{text-align:center}.small{font-size:13px;color:#a6acd6;line-height:1.5}
 .report-row{display:flex;align-items:center;gap:10px;margin:8px 0}.report-row .name{width:130px;font-weight:bold;font-size:13px}.report-row .track{flex:1;height:14px;background:#11152a;border-radius:8px;overflow:hidden;border:2px solid var(--line)}.report-row .track>i{display:block;height:100%}.report-row .pct{width:44px;text-align:right;font-weight:bold;font-size:13px}
 .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#000;border:2px solid var(--accent);color:var(--accent);padding:9px 18px;border-radius:999px;font-weight:bold;opacity:0;transition:opacity .25s,top .25s;pointer-events:none;z-index:60}.toast.show{opacity:1;top:26px}
 .matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.mcol{display:grid;gap:8px}
 .mbtn{padding:12px;border-radius:11px;border:2px solid var(--line);background:#1c2342;color:var(--ink);cursor:pointer;font-family:inherit;font-size:15px}.mbtn.sel{border-color:var(--accent);color:var(--accent)}.mbtn.done{background:#13311f;border-color:#2fbf6e;color:var(--good);cursor:default}.mbtn.bad{background:var(--accent2);color:#fff}
 input[type=text]{width:100%;padding:13px;border-radius:12px;border:2px solid var(--line);background:#11152a;color:var(--ink);font-size:16px;font-family:inherit}
 textarea{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:#11152a;color:var(--ink);font-size:15px;font-family:inherit}
 input[type=range]{width:100%}
 .keys{display:flex;gap:3px;overflow-x:auto;padding:8px 0;justify-content:center}
 .key{flex:none;width:40px;height:120px;border-radius:0 0 7px 7px;border:2px solid #11152a;background:#f3f3ff;color:#222;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:11px;font-weight:bold}
 .key.blk{background:#222a44;color:#eef;height:80px;width:30px}
 .key:active{background:var(--accent)}
 .rxbox{margin:14px 0;border-radius:16px;padding:46px 16px;text-align:center;font-size:22px;font-weight:bold;cursor:pointer;border:2px solid var(--line)}
</style></head><body>
<div class="toast" id="toast"></div><div class="wrap"><div class="panel" id="app"></div></div>
<script>
const GAME={"file": "CodeNinja", "id": "comp", "name": "CodeNinja", "emoji": "💻", "accent": "#39e6ff", "accent2": "#ff4d6d", "tagline": "Hack through eSafety, Python & algorithms — then flip some bits.", "extras": [{"type": "binary"}], "topics": [{"key": "esafety", "name": "eSafety & the Internet", "emoji": "🔒", "boss": "The Hacker", "bem": "🕵️", "taunts": ["Your password is weak!", "I'll phish you!", "Overshare incoming!"], "qs": [{"q": "Which is the STRONGEST password?", "o": ["7hX!q2$Lp9@", "password", "julian2012", "123456"], "a": 0, "w": "Long, mixed case, numbers & symbols, not personal."}, {"q": "'Phishing' is…", "o": ["Fake messages tricking you into giving personal info", "A hobby", "A type of loop", "A safe website"], "a": 0, "w": "Fake messages to steal personal info."}, {"q": "Which should you keep PRIVATE online?", "o": ["Your home address & passwords", "Your favourite colour", "A meme", "The weather"], "a": 0, "w": "Never share address, phone number or passwords."}, {"q": "A stranger online asks for personal details. You…", "o": ["Don't share & tell a trusted adult", "Send them straight away", "Share only your address", "Tell no one ever"], "a": 0, "w": "Don't share; tell a trusted adult."}], "notes": ["<b>Strong passwords:</b> long, mixed letters/numbers/symbols, not personal or reused.", "<b>Phishing</b> = fake messages trying to steal personal info.", "Keep <b>private:</b> address, phone number, passwords, school.", "If a stranger contacts you: don't share details — tell a trusted adult."]}, {"key": "python", "name": "Programming (Python)", "emoji": "🐍", "boss": "The Glitch", "bem": "🤖", "taunts": ["Syntax error: YOU.", "You can't loop out!", "Variable not defined!"], "qs": [{"q": "In Python, print(\"Hello\") does…", "o": ["Displays Hello on the screen", "Prints to a printer", "Deletes a file", "Saves the program"], "a": 0, "w": "print() displays text on screen."}, {"q": "A 'loop' is used to…", "o": ["Repeat instructions", "Make a decision", "Store a value", "Delete code"], "a": 0, "w": "A loop repeats instructions."}, {"q": "'Selection' means…", "o": ["Making a decision with IF statements", "Repeating code", "Saving a file", "Sending an email"], "a": 0, "w": "Selection = decisions with IF/ELSE."}, {"q": "A 'variable' is…", "o": ["A named store for a value that can change", "A permanent number", "A type of loop", "A printer"], "a": 0, "w": "A named store whose value can change."}], "notes": ["<b>print()</b> displays text on screen.", "<b>Variable</b> = a named store for a value that can change.", "<b>Selection</b> = decisions (IF/ELSE); <b>iteration</b> = loops that repeat code.", "Code runs top to bottom — sequence (order) matters."]}, {"key": "algo", "name": "Data & Algorithms", "emoji": "🧠", "boss": "The Mainframe", "bem": "🖥️", "taunts": ["Sort THIS!", "Your algorithm fails!", "Field or record? Ha!"], "qs": [{"q": "What is an algorithm?", "o": ["A step-by-step set of instructions to solve a problem", "A virus", "An app", "A password"], "a": 0, "w": "A precise step-by-step set of instructions."}, {"q": "In a database, a RECORD is…", "o": ["All the data about one item (a row)", "One letter", "A password", "The internet"], "a": 0, "w": "A record = a row (all data about one item)."}, {"q": "In a database, a FIELD is…", "o": ["One piece of data (a column)", "Every record", "A grassy area", "A loop"], "a": 0, "w": "A field = one column, e.g. 'surname'."}, {"q": "Order matters in an algorithm because…", "o": ["The wrong order gives the wrong result", "It looks nicer", "Computers ignore order", "Order never matters"], "a": 0, "w": "Steps must be in the right sequence."}], "notes": ["<b>Algorithm</b> = a precise step-by-step set of instructions.", "Steps must be in the right <b>order</b> or you get the wrong result.", "<b>Database:</b> a <b>field</b> = a column (one piece of data); a <b>record</b> = a row (all data about one item).", "Computers store all data as <b>binary</b> (0s and 1s)."]}], "written": {"Computing": [{"m": 1, "q": "What is an algorithm?", "s": ["A step-by-step set of instructions to solve a problem"]}, {"m": 2, "q": "Give two features of a strong password.", "s": ["Long (12+ chars)", "Mix of cases, numbers & symbols (not reused/personal)"]}, {"m": 2, "q": "Difference between a field and a record?", "s": ["A field is one piece of data — a column", "A record is all the data about one item — a row"]}, {"m": 2, "q": "Explain the difference between selection and iteration.", "s": ["Selection = making a decision (IF/ELSE)", "Iteration = repeating instructions (a loop)"]}, {"m": 2, "q": "Convert the binary number 1010 into decimal.", "s": ["8 + 0 + 2 + 0", "= 10"]}]}};
document.documentElement.style.setProperty('--accent',GAME.accent);
document.documentElement.style.setProperty('--accent2',GAME.accent2);
const app=document.getElementById('app'),toastEl=document.getElementById('toast');
function toast(t){toastEl.innerHTML=t;toastEl.classList.add('show');clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.classList.remove('show'),1100);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function ex(t){return (GAME.extras||[]).find(e=>e.type===t);}
function loadScores(){try{return JSON.parse(localStorage.getItem('rqg_'+GAME.id)||'{}')}catch(e){return{}}}
function saveScore(k,c,t){const s=loadScores();const p=Math.round(c/t*100);if(s[k]==null||p>=s[k])s[k]=p;localStorage.setItem('rqg_'+GAME.id,JSON.stringify(s));}
let muted=false,actx;
function ac(){actx=actx||new(window.AudioContext||window.webkitAudioContext)();return actx;}
function beep(f,d,t){if(muted)return;try{const a=ac();const o=a.createOscillator(),g=a.createGain();o.type=t||'square';o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.start();o.stop(a.currentTime+d)}catch(e){}}
function tone(f,d){try{const a=ac();const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.25,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.start();o.stop(a.currentTime+d)}catch(e){}}
const sfx={good:()=>{beep(660,.08);setTimeout(()=>beep(880,.12),80)},crit:()=>{[660,990,1320].forEach((f,i)=>setTimeout(()=>beep(f,.1),i*70))},bad:()=>beep(180,.18,'sawtooth'),click:()=>beep(440,.04),win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16),i*110))};

function home(){app.innerHTML=`<h1>${GAME.emoji} ${GAME.name}</h1><div class="sub">${GAME.tagline}</div><button class="btn" onclick="sfx.click();map()">▶️ Start</button><p class="small center" style="margin-top:10px">Boss battles · interactive labs · mark-scheme questions</p>`;}
const EXTRA_TILE={calc:['🥋','Number Dojo','dojo'],vocab:['🔤','Vocab Match','vocabMatch'],tts:['🔊','Hear It!','ttsLab'],piano:['🎹','Play Piano','piano'],binary:['🔢','Binary Lab','binaryLab'],reaction:['⚡','Reaction Test','reaction'],colour:['🎨','Colour Mixer','colourLab'],order:['🔀','Order It!','orderLab'],bball:['🏀','Shoot Hoops','bball'],foodorder:['🍔','Food Orders','foodOrder']};
function map(){const s=loadScores();let tiles='';if(RF&&RF.timer){clearInterval(RF.timer);RF.timer=null;}BB=null;
 GAME.topics.forEach((t,i)=>{const sc=s[t.key];tiles+=`<div class="tile" onclick="sfx.click();topicMenu(${i})">${sc!=null?`<span class="pct">${sc}%</span>`:''}<div class="em">${t.emoji}</div><b>${t.name}</b></div>`;});
 (GAME.extras||[]).forEach(e=>{const t=EXTRA_TILE[e.type];if(t)tiles+=`<div class="tile" onclick="sfx.click();${t[2]}()"><div class="em">${t[0]}</div><b>${t[1]}</b></div>`;});
 tiles+=`<div class="tile" onclick="sfx.click();rapidFire()"><div class="em">⏱️</div><b>Rapid Fire</b></div>`;
 tiles+=`<div class="tile" onclick="sfx.click();memoryMatch()"><div class="em">🃏</div><b>Memory Match</b></div>`;
 tiles+=`<div class="tile" onclick="sfx.click();flashcards()"><div class="em">📇</div><b>Flashcards</b></div>`;
 tiles+=`<div class="tile" onclick="sfx.click();survival()"><div class="em">🎯</div><b>Survival</b></div>`;
 tiles+=`<div class="tile" onclick="sfx.click();trueFalse()"><div class="em">✅</div><b>True / False</b></div>`;
 tiles+=`<div class="tile" onclick="sfx.click();ladder()"><div class="em">🎰</div><b>Quiz Ladder</b></div>`;
 tiles+=`<div class="tile" onclick="sfx.click();writtenMenu()"><div class="em">📝</div><b>Written Exam</b></div>`;
 tiles+=`<div class="tile" onclick="sfx.click();finalExam()"><div class="em">🎓</div><b>Final Exam</b></div>`;
 tiles+=`<div class="tile" onclick="sfx.click();gapReport()"><div class="em">📊</div><b>Gap Report</b></div>`;
 app.innerHTML=`<div class="topbar"><span class="tag">${GAME.emoji} ${GAME.name}</span></div><h2>Choose your challenge</h2><div class="sub">Beat the bosses, mess with the labs, then sit the Final Exam.</div><div class="grid">${tiles}</div><button class="btn ghost" onclick="sfx.click();home()">🏠 Home</button>`;}

function topicMenu(i){const t=GAME.topics[i];app.innerHTML=`<div class="topbar"><span class="tag">${t.emoji} ${t.name}</span></div>
 <h2>${t.emoji} ${t.name}</h2><div class="sub">Learn it first, then beat the boss.</div>
 <button class="btn" onclick="sfx.click();learn(${i})">📚 Learn this topic</button>
 <button class="btn green" onclick="sfx.click();quizTopic(${i})">⚔️ Boss battle</button>
 <button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>`;}
function learn(i){const t=GAME.topics[i];const notes=(t.notes||[]).map(n=>`<li style="margin:9px 0">${n}</li>`).join('');
 app.innerHTML=`<div class="topbar"><span class="tag">📚 Learn</span></div><h2>${t.emoji} ${t.name}</h2>
 <div class="info" style="line-height:1.65"><b style="color:var(--accent)">Key facts to learn:</b><ul style="margin:10px 0 0 18px">${notes||'<li>Revision notes coming soon.</li>'}</ul></div>
 <button class="btn green" onclick="sfx.click();quizTopic(${i})">⚔️ Got it — battle the boss!</button>
 <button class="btn ghost" onclick="sfx.click();topicMenu(${i})">⬅️ Back</button>`;}
let B;
function quizTopic(i){const t=GAME.topics[i];B={t,qs:shuffle(t.qs.slice()),i:0,score:0,streak:0,best:0,correct:0,hp:5,bossMax:t.qs.length,bossHP:t.qs.length,answered:false};drawBattle();}
function drawBattle(){if(B.i>=B.qs.length)return battleWin();if(B.hp<=0)return battleFaint();B.answered=false;const t=B.t,q=B.qs[B.i],taunt=t.taunts[B.i%t.taunts.length];
 app.innerHTML=`<div class="topbar"><span class="tag">${t.emoji} ${t.name}</span></div>
  <div class="fighter"><div class="face">${t.bem}</div><div style="flex:1"><div class="nm"><b>${t.boss}</b><span>${B.bossHP}/${B.bossMax} HP</span></div><div class="hpbar hp-e"><i style="width:${B.bossHP/B.bossMax*100}%"></i></div></div></div>
  <div class="bubble">"${taunt}"</div>
  <div class="fighter"><div class="face">🧑‍🎓</div><div style="flex:1"><div class="nm"><b>You</b><span>${'❤️'.repeat(B.hp)}${'🖤'.repeat(5-B.hp)}</span></div><div class="hpbar hp-s"><i style="width:${B.hp/5*100}%"></i></div></div></div>
  <div class="hud"><div class="stat"><b>${B.score}</b><span>Score</span></div><div class="stat streak ${B.streak>=2?'fire':''}"><b>${B.streak}${B.streak>=2?'🔥':''}</b><span>Combo</span></div><div class="stat"><b>${B.i+1}/${B.qs.length}</b><span>Q</span></div></div>
  <div class="q">${q.q}</div><div class="opts" id="opts"></div><div class="explain" id="explain"></div><button class="btn" id="next" style="display:none" onclick="sfx.click();bNext()">NEXT ➡️</button>`;
 const opts=document.getElementById('opts');q.o.map((tx,k)=>({tx,k})).sort(()=>Math.random()-0.5).forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o.tx;b.onclick=()=>bAns(b,o.k===q.a,q);opts.appendChild(b);});}
function bAns(btn,correct,q){if(B.answered)return;B.answered=true;document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===q.o[q.a])b.classList.add('correct');else b.classList.add('dim');});
 const exx=document.getElementById('explain');exx.innerHTML=(correct?"✅ <b>HIT!</b> ":"❌ <b>Answer:</b> ")+q.w;exx.style.display='block';
 if(correct){B.correct++;B.streak++;B.best=Math.max(B.best,B.streak);B.bossHP=Math.max(0,B.bossHP-1);B.score+=100+(B.streak-1)*25;if(B.streak>=3){sfx.crit();toast("💥 CRITICAL! x"+B.streak);}else{sfx.good();toast("✅ +"+(100+(B.streak-1)*25));}}
 else{B.streak=0;B.hp--;btn.classList.remove('dim');btn.classList.add('wrong');sfx.bad();toast("💢 Boss hits back!");}
 document.querySelector('.hp-e>i').style.width=Math.max(0,B.bossHP/B.bossMax*100)+'%';document.querySelector('.hp-s>i').style.width=B.hp/5*100+'%';
 const n=document.getElementById('next');n.style.display='block';n.textContent=B.i>=B.qs.length-1?'🏁 FINISH':'NEXT ➡️';}
function bNext(){if(B.hp<=0)return battleFaint();B.i++;drawBattle();}
function battleRetry(){B.i=0;B.score=0;B.streak=0;B.correct=0;B.hp=5;B.bossHP=B.bossMax;shuffle(B.qs);drawBattle();}
function battleFaint(){sfx.bad();app.innerHTML=`<h1>😵 Fainted!</h1><div class="center" style="font-size:54px">🤕</div><p class="center small" style="margin:14px 0">${B.t.boss} got 5 hits in — just a few gaps. Revise & retry!</p><button class="btn" onclick="sfx.click();battleRetry()">🔁 Retry</button><button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>`;}
function battleWin(){sfx.win();saveScore(B.t.key,B.correct,B.qs.length);const pct=Math.round(B.correct/B.qs.length*100);
 app.innerHTML=`<h1>🏆 ${B.t.boss} DEFEATED!</h1><div class="center" style="font-size:54px">${B.t.bem}💥</div>
  <div class="hud" style="margin-top:14px"><div class="stat"><b>${B.score}</b><span>Score</span></div><div class="stat"><b>${pct}%</b><span>Accuracy</span></div><div class="stat"><b>${B.best}🔥</b><span>Best combo</span></div></div>
  <p class="center small">${pct>=90?"🌟 Flawless!":pct>=70?"💪 Strong — one more for the perfect run!":"📚 Beaten — revise & retry."}</p>

function vmPick(side,enc){const w=decodeURIComponent(enc);const el=document.getElementById(vmId(side,w));if(!el||el.classList.contains('done'))return;sfx.click();
 if(side==='L'){if(VM.selL){const p=document.getElementById(vmId('L',VM.selL));if(p)p.classList.remove('sel');}VM.selL=w;el.classList.add('sel');}

 if(VM.selL&&VM.selR){VM.tries++;const ok=VM.pairs.some(p=>p[0]===VM.selL&&p[1]===VM.selR);const lEl=document.getElementById(vmId('L',VM.selL)),rEl=document.getElementById(vmId('R',VM.selR));
  if(ok){lEl.classList.add('done');rEl.classList.add('done');lEl.classList.remove('sel');rEl.classList.remove('sel');VM.done++;sfx.good();VM.selL=null;VM.selR=null;
   if(VM.done>=VM.pairs.length){sfx.win();const sb=document.getElementById('vmsub');if(sb)sb.innerHTML='🎉 All matched! '+VM.pairs.length+' pairs in '+VM.tries+' tries.';}}
  else{lEl.classList.add('bad');rEl.classList.add('bad');sfx.bad();const a=VM.selL,b=VM.selR;VM.selL=null;VM.selR=null;

 var exact=vs.filter(function(v){return (v.lang||'').toLowerCase().replace('_','-')===lang.toLowerCase();});
 if(exact.length)return exact[0];
 return vs.find(function(v){return (v.lang||'').toLowerCase().replace('_','-').indexOf(pre)===0})||null;}
function ttsLab(){TTS=ex('tts');try{if(window.speechSynthesis)speechSynthesis.getVoices();}catch(e){}

function gapReport(){const s=loadScores();const names={};GAME.topics.forEach(t=>names[t.key]=t.name);
 const ranked=GAME.topics.map(t=>({c:t.name,p:s[t.key]})).filter(x=>x.p!=null).sort((a,b)=>a.p-b.p);
 const rows=ranked.map(r=>{const col=r.p>=80?'var(--good)':r.p>=50?'var(--accent)':'var(--accent2)';return `<div class="report-row"><div class="name">${r.c}</div><div class="track"><i style="width:${r.p}%;background:${col}"></i></div><div class="pct" style="color:${col}">${r.p}%</div></div>`;}).join('');
 const weak=ranked.filter(r=>r.p<70).map(r=>r.c);
 app.innerHTML=`<h1>📊 Gap Report</h1><div class="sub">${GAME.name}</div>${rows||'<p class="small center">Beat some bosses first!</p>'}${weak.length?`<div class="info" style="margin-top:12px"><b>🎯 Revise these first:</b> ${weak.join(', ')}.</div>`:(ranked.length?'<div class="info" style="margin-top:12px">🎉 Every attempted topic ≥70%!</div>':'')}<button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>`;}

/* ===== shared mini-games (every subject) ===== */
function allQ(){let a=[];GAME.topics.forEach(t=>t.qs.forEach(q=>a.push(Object.assign({cat:t.name},q))));return a;}
let RF=null;
function rapidFire(){RF={qs:shuffle(allQ()),i:0,score:0,t:60};RF.timer=setInterval(()=>{if(!RF)return;RF.t--;const e=document.getElementById('rftime');if(e)e.textContent=RF.t;if(RF.t<=0)rfEnd();},1000);rfQ();}
function rfQ(){if(RF.i>=RF.qs.length){RF.qs=shuffle(allQ());RF.i=0;}const q=RF.qs[RF.i];
 app.innerHTML=`<div class="topbar"><span class="tag">⏱️ Rapid Fire</span></div><div class="hud"><div class="stat"><b id="rftime">${RF.t}</b><span>Seconds</span></div><div class="stat"><b>${RF.score}</b><span>Correct</span></div></div><span class="cat">${q.cat}</span><div class="q">${q.q}</div><div class="opts" id="opts"></div>`;
 const o2=document.getElementById('opts');q.o.map((tx,k)=>({tx,k})).sort(()=>Math.random()-0.5).forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o.tx;b.onclick=()=>rfAns(o.k===q.a);o2.appendChild(b);});}
function rfAns(ok){if(!RF||RF.t<=0)return;if(ok){RF.score++;sfx.good();}else sfx.bad();RF.i++;rfQ();}
function rfEnd(){if(RF&&RF.timer)clearInterval(RF.timer);sfx.win();const sc=RF?RF.score:0;RF=null;app.innerHTML=`<h1>⏱️ Time's up!</h1><div class="center" style="font-size:54px">🔥</div><div class="hud"><div class="stat"><b>${sc}</b><span>Correct in 60s</span></div></div><p class="center small">${sc>=15?'⚡ Lightning fast!':sc>=8?'💪 Good pace!':'Keep practising!'}</p><button class="btn" onclick="sfx.click();rapidFire()">🔁 Again</button><button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>`;}
let MM;
function memoryMatch(){const qs=shuffle(allQ()).slice(0,6);const cards=[];qs.forEach((q,i)=>{const a=q.o[q.a];const ql=q.q.length>44?q.q.slice(0,42)+'…':q.q;cards.push({id:i,txt:ql});cards.push({id:i,txt:a});});MM={cards:shuffle(cards),flipped:[],done:0,moves:0,lock:false};drawMM();}
function drawMM(){const g=MM.cards.map((c,n)=>{const open=MM.flipped.includes(n)||c.matched;return `<button class="mbtn" style="min-height:66px;font-size:11.5px;line-height:1.2;${c.matched?'background:#13311f;border-color:#2fbf6e;color:#3ddc84':''}" onclick="mmPick(${n})">${open?c.txt:'❓'}</button>`;}).join('');
 app.innerHTML=`<div class="topbar"><span class="tag">🃏 Memory Match</span></div><div class="sub">Flip cards to match each question with its answer. Pairs: <b>${MM.done}/6</b> · Moves: ${MM.moves}</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">${g}</div><button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>`;}
function mmPick(n){if(MM.lock)return;const c=MM.cards[n];if(c.matched||MM.flipped.includes(n))return;sfx.click();MM.flipped.push(n);drawMM();
 if(MM.flipped.length===2){MM.moves++;MM.lock=true;const a=MM.flipped[0],b=MM.flipped[1],ca=MM.cards[a],cb=MM.cards[b];
  if(ca.id===cb.id){ca.matched=cb.matched=true;MM.done++;sfx.good();MM.flipped=[];MM.lock=false;drawMM();if(MM.done>=6){sfx.win();setTimeout(()=>toast('🎉 Matched all 6 in '+MM.moves+' moves!'),200);}}
  else{sfx.bad();setTimeout(()=>{MM.flipped=[];MM.lock=false;drawMM();},850);}}}
let FC;
function flashcards(){FC={qs:shuffle(allQ()),i:0,show:false};drawFC();}
function drawFC(){const q=FC.qs[FC.i];const back='<b>Answer:</b> '+q.o[q.a]+'<br><br><span class="small">'+q.w+'</span>';
 app.innerHTML=`<div class="topbar"><span class="tag">📇 Flashcards ${FC.i+1}/${FC.qs.length}</span></div><span class="cat">${q.cat}</span>
  <div onclick="FC.show=!FC.show;drawFC()" style="min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;background:#11152a;border:2px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;font-size:17px">${FC.show?back:('<b>'+q.q+'</b><br><br><span class="small">(tap to reveal answer)</span>')}</div>
  <div style="display:flex;gap:10px"><button class="btn ghost" style="flex:1" onclick="sfx.click();FC.i=(FC.i-1+FC.qs.length)%FC.qs.length;FC.show=false;drawFC()">⬅️ Prev</button><button class="btn" style="flex:1" onclick="sfx.click();FC.i=(FC.i+1)%FC.qs.length;FC.show=false;drawFC()">Next ➡️</button></div>
  <button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>`;}
/* Basketball shooting */
let BB=null,BBRAF;
function bball(){BB={made:0,att:0,power:0,dir:1,state:'aim',target:[55,78],t:0};drawBB();}
function drawBB(){app.innerHTML=`<div class="topbar"><span class="tag">🏀 Shoot Hoops</span></div><div class="sub" id="bbsub">Tap SHOOT when the power bar hits the green zone! Made: <b>0</b> / 0</div>
  <canvas id="bb" width="460" height="240"></canvas>
  <button class="btn" onclick="bbShoot()">🏀 SHOOT</button>
  <div class="info">Shooting trains <b>hand–eye coordination</b>. BEEF = Balance, Eyes, Elbow, Follow-through.</div>
  <button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>`;BB.t=0;bbLoop();}
function bbLoop(){if(!BB)return;const cv=document.getElementById('bb');if(!cv){return;}const ctx=cv.getContext('2d'),W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);ctx.fillStyle='#0a1424';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#cfd6e6';ctx.lineWidth=3;ctx.strokeRect(W-58,46,38,34);ctx.strokeStyle='#ff7a3c';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(W-80,84);ctx.lineTo(W-58,84);ctx.stroke();
 if(BB.state==='aim'){BB.power+=BB.dir*2.6;if(BB.power>=100){BB.power=100;BB.dir=-1;}if(BB.power<=0){BB.power=0;BB.dir=1;}}
 const bx=36,by=H-26,bh=176;ctx.fillStyle='#22324f';ctx.fillRect(bx,by-bh,22,bh);
 ctx.fillStyle='rgba(61,220,132,.5)';ctx.fillRect(bx,by-bh*BB.target[1]/100,22,bh*(BB.target[1]-BB.target[0])/100);
 ctx.fillStyle='#ffd23f';ctx.fillRect(bx,by-bh*BB.power/100-2,22,5);
 if(BB.state==='shoot'){BB.t+=0.035;const t=BB.t,sx=95,sy=H-40,ex=W-69,ey=84;const x=sx+(ex-sx)*t,y=sy+(ey-sy)*t-BB.arc*Math.sin(Math.PI*t);
  ctx.fillStyle='#ff7a3c';ctx.beginPath();ctx.arc(x,y,12,0,6.28);ctx.fill();
  if(t>=1){BB.state='aim';BB.att++;if(BB.scoreThis)BB.made++;const sb=document.getElementById('bbsub');if(sb)sb.innerHTML=`Tap SHOOT when the power bar hits the green zone! Made: <b>${BB.made}</b> / ${BB.att}`;if(BB.scoreThis){sfx.win();toast('🏀 SWISH!');}else{sfx.bad();toast('❌ Off the rim!');}const lo=28+Math.floor(Math.random()*42);BB.target=[lo,lo+18];}
 } else {ctx.fillStyle='#ff7a3c';ctx.beginPath();ctx.arc(95,H-40,12,0,6.28);ctx.fill();}
 BBRAF=requestAnimationFrame(bbLoop);}
function bbShoot(){if(!BB||BB.state!=='aim')return;BB.scoreThis=(BB.power>=BB.target[0]&&BB.power<=BB.target[1]);BB.arc=130+BB.power;BB.t=0;BB.state='shoot';}
/* Food ordering */
const FOOD=[
 {ask:"A vegan customer orders — which can they have?",o:["Veggie & hummus wrap","Chicken sandwich","Ham pizza","Tuna melt"],a:0,w:"Vegans avoid all animal products (no meat, fish, dairy or eggs)."},
 {ask:"A customer is gluten-free. Pick a safe dish.",o:["Rice & grilled vegetables","White bread roll","Pasta bake","Battered fish"],a:0,w:"Gluten is in wheat (bread, pasta, batter); rice is naturally gluten-free."},
 {ask:"Which meal is highest in PROTEIN (growth & repair)?",o:["Grilled chicken & beans","Plain white rice","An apple","A lettuce salad"],a:0,w:"Chicken and beans are protein-rich."},
 {ask:"A customer keeps Halal. Which is suitable?",o:["Halal lamb curry","Pork sausages","Bacon roll","Ham salad"],a:0,w:"Halal diets exclude pork, so bacon/ham/pork are out."},
 {ask:"Best source of slow-release ENERGY (carbohydrate)?",o:["Wholemeal pasta","A glass of water","A vitamin tablet","Black coffee"],a:0,w:"Carbohydrates (e.g. pasta) are the body's main energy source."},
 {ask:"To cut FOOD MILES, the cafe should buy…",o:["Local seasonal veg","Bananas flown 4,000 miles","Lamb from New Zealand","Out-of-season berries"],a:0,w:"Local food travels fewer miles — better for the environment."},
];
let FO;
function foodOrder(){FO={qs:shuffle(FOOD.slice()),i:0,score:0,answered:false};foQ();}
function foQ(){if(FO.i>=FO.qs.length)return foEnd();const q=FO.qs[FO.i];FO.answered=false;
 app.innerHTML=`<div class="topbar"><span class="tag">🍔 Food Orders</span></div><div class="hud"><div class="stat"><b>${FO.score}</b><span>Tips</span></div><div class="stat"><b>${FO.i+1}/${FO.qs.length}</b><span>Order</span></div></div>
  <div class="bubble" style="font-size:15px">🧑 "${q.ask}"</div><div class="opts" id="opts"></div><div class="explain" id="ex"></div><button class="btn" id="nx" style="display:none" onclick="sfx.click();FO.i++;foQ();">Next order ➡️</button><button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>`;
 const o2=document.getElementById('opts');q.o.map((tx,k)=>({tx,k})).sort(()=>Math.random()-0.5).forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o.tx;b.onclick=()=>foAns(b,o.k===q.a,q);o2.appendChild(b);});}
function foAns(btn,ok,q){if(FO.answered)return;FO.answered=true;document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===q.o[q.a])b.classList.add('correct');else b.classList.add('dim');});const ex=document.getElementById('ex');ex.innerHTML=(ok?"✅ <b>Order served!</b> ":"❌ <b>Best choice:</b> ")+q.w;ex.style.display='block';if(ok){FO.score++;sfx.good();}else sfx.bad();const nx=document.getElementById('nx');nx.style.display='block';if(FO.i>=FO.qs.length-1)nx.textContent='🏁 Finish shift';}
function foEnd(){sfx.win();app.innerHTML=`<h1>🍔 Shift over!</h1><div class="center" style="font-size:54px">${FO.score>=5?'🌟':'👍'}</div><div class="hud"><div class="stat"><b>${FO.score}/${FO.qs.length}</b><span>Orders right</span></div></div><button class="btn" onclick="sfx.click();foodOrder()">🔁 New shift</button><button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>`;}

/* Survival */
let SV;
function survival(){SV={qs:shuffle(allQ()),i:0,lives:3,score:0};svQ();}
function svQ(){if(SV.i>=SV.qs.length){SV.qs=shuffle(allQ());SV.i=0;}const q=SV.qs[SV.i];
 app.innerHTML=`<div class="topbar"><span class="tag">🎯 Survival</span></div><div class="hud"><div class="stat"><b>${'❤️'.repeat(SV.lives)||'💀'}</b><span>Lives</span></div><div class="stat"><b>${SV.score}</b><span>Streak</span></div></div><span class="cat">${q.cat}</span><div class="q">${q.q}</div><div class="opts" id="opts"></div><div class="explain" id="ex"></div><button class="btn" id="nx" style="display:none">Next ➡️</button><button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>`;
 const o=document.getElementById('opts');q.o.map((tx,k)=>({tx,k})).sort(()=>Math.random()-0.5).forEach(x=>{const b=document.createElement('button');b.className='opt';b.textContent=x.tx;b.onclick=()=>svAns(b,x.k===q.a,q);o.appendChild(b);});}
function svAns(btn,ok,q){document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===q.o[q.a])b.classList.add('correct');else b.classList.add('dim');});const ex=document.getElementById('ex');
 if(ok){SV.score++;sfx.good();ex.innerHTML='✅ Correct! Streak: '+SV.score;}else{SV.lives--;sfx.bad();btn.classList.add('wrong');ex.innerHTML='❌ '+q.w;}ex.style.display='block';
 const nx=document.getElementById('nx');nx.style.display='block';nx.textContent=SV.lives<=0?'💀 See result':'Next ➡️';nx.onclick=()=>{sfx.click();if(SV.lives<=0)svEnd();else{SV.i++;svQ();}};}
function svEnd(){sfx.win();const key='rqg_'+GAME.id+'_sv';const best=Math.max(SV.score,+(localStorage.getItem(key)||0));localStorage.setItem(key,best);
 app.innerHTML=`<h1>🎯 Survival over</h1><div class="center" style="font-size:54px">💀</div><div class="hud"><div class="stat"><b>${SV.score}</b><span>This streak</span></div><div class="stat"><b>${best}</b><span>Best ever</span></div></div><button class="btn" onclick="sfx.click();survival()">🔁 Again</button><button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>`;}
/* True or False */
let TF;
function trueFalse(){TF={qs:shuffle(allQ()),i:0,score:0};tfQ();}
function tfQ(){if(TF.i>=TF.qs.length){TF.qs=shuffle(allQ());TF.i=0;}const q=TF.qs[TF.i];const showT=Math.random()<0.5;
 const claim=showT?q.o[q.a]:q.o[(q.a+1+Math.floor(Math.random()*(q.o.length-1)))%q.o.length];TF.cur={q,isTrue:showT};
 app.innerHTML=`<div class="topbar"><span class="tag">✅❌ True or False</span></div><div class="hud"><div class="stat"><b>${TF.score}</b><span>Score</span></div><div class="stat"><b>${TF.i+1}</b><span>Q</span></div></div><span class="cat">${q.cat}</span>
  <div class="q">${q.q}</div><div class="info" style="margin-bottom:10px">Proposed answer: <b>${claim}</b></div>
  <div style="display:flex;gap:10px"><button class="btn green" style="flex:1" onclick="tfAns(true)">✅ True</button><button class="btn" style="flex:1;background:linear-gradient(180deg,#ff4d6d,#d62f4d);color:#fff" onclick="tfAns(false)">❌ False</button></div>
  <div class="explain" id="ex"></div><button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>`;}
function tfAns(g){const c=TF.cur,ok=g===c.isTrue,ex=document.getElementById('ex');
 if(ok){TF.score++;sfx.good();ex.innerHTML='✅ Correct!';}else{sfx.bad();ex.innerHTML='❌ Wrong — the correct answer is <b>'+c.q.o[c.q.a]+'</b>.';}
 ex.style.display='block';setTimeout(()=>{TF.i++;tfQ();},1050);}
/* Quiz Ladder */
const RUNGS=[100,200,300,500,1000,2000,4000,8000,16000,32000];
let LAD;
function ladder(){LAD={qs:shuffle(allQ()),i:0,lvl:0};ladQ();}
function ladQ(){if(LAD.lvl>=RUNGS.length)return ladWin();if(LAD.i>=LAD.qs.length){LAD.qs=shuffle(allQ());LAD.i=0;}const q=LAD.qs[LAD.i];
 app.innerHTML=`<div class="topbar"><span class="tag">🎰 Quiz Ladder</span></div><div class="hud"><div class="stat"><b>£${RUNGS[LAD.lvl]}</b><span>Playing for</span></div><div class="stat"><b>£${LAD.lvl>0?RUNGS[LAD.lvl-1]:0}</b><span>Banked</span></div></div><span class="cat">${q.cat}</span><div class="q">${q.q}</div><div class="opts" id="opts"></div><div class="explain" id="ex"></div><button class="btn ghost" onclick="sfx.click();ladBank()">💰 Bank & quit</button>`;
 const o=document.getElementById('opts');q.o.map((tx,k)=>({tx,k})).sort(()=>Math.random()-0.5).forEach(x=>{const b=document.createElement('button');b.className='opt';b.textContent=x.tx;b.onclick=()=>ladAns(b,x.k===q.a,q);o.appendChild(b);});}
function ladAns(btn,ok,q){document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===q.o[q.a])b.classList.add('correct');else b.classList.add('dim');});const ex=document.getElementById('ex');
 if(ok){sfx.good();LAD.lvl++;LAD.i++;ex.innerHTML='✅ Correct — climbing!';ex.style.display='block';setTimeout(ladQ,850);}
 else{sfx.bad();btn.classList.add('wrong');ex.innerHTML='❌ '+q.w;ex.style.display='block';setTimeout(ladLose,1500);}}
function ladBank(){sfx.win();const amt=LAD.lvl>0?RUNGS[LAD.lvl-1]:0;app.innerHTML=`<h1>💰 Banked £${amt}</h1><div class="center" style="font-size:54px">🤑</div><button class="btn" onclick="sfx.click();ladder()">🔁 Play again</button><button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>`;}
function ladLose(){app.innerHTML=`<h1>💸 Wrong!</h1><div class="center" style="font-size:54px">😬</div><p class="center small">You dropped to £0 — should've banked!</p><button class="btn" onclick="sfx.click();ladder()">🔁 Try again</button><button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>`;}
function ladWin(){sfx.win();app.innerHTML=`<h1>🏆 £32,000!</h1><div class="center" style="font-size:54px">🎉</div><p class="center small">You climbed the whole ladder — genius!</p><button class="btn" onclick="sfx.click();ladder()">🔁 Again</button><button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>`;}

home();
