<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚗️ MAD LAB — Interactive Science Quest 🔬</title>
<style>
  :root{
    --bg:#070b14; --panel:#0e1626; --panel2:#13203a; --line:#244064;
    --neon:#39e6ff; --neon2:#7cff6b; --acid:#ffe14d; --danger:#ff4d6d; --pur:#b06bff;
    --ink:#eaf4ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Trebuchet MS','Segoe UI',sans-serif;color:var(--ink);
    background:radial-gradient(1200px 700px at 70% -10%, #16263f 0%, var(--bg) 60%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px;overflow-x:hidden}
  .wrap{width:100%;max-width:880px}
  .panel{background:linear-gradient(180deg,#0f1a2e,#0b1322);border:2px solid var(--line);
    border-radius:20px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05)}
  h1{font-size:30px;text-align:center;letter-spacing:.04em;text-shadow:0 0 18px rgba(57,230,255,.5), 0 2px 0 #000}
  h2{font-size:22px;margin-bottom:6px}
  .sub{text-align:center;color:#8fb3d9;margin-bottom:14px;font-size:14px}
  .glow{color:var(--neon)}
  .btn{margin-top:12px;width:100%;padding:14px;border:none;border-radius:13px;cursor:pointer;
    font-size:17px;font-weight:bold;font-family:inherit;color:#012;
    background:linear-gradient(180deg,var(--neon),#1ec8e6);box-shadow:0 5px 0 #128199, 0 10px 18px rgba(0,0,0,.4);transition:transform .06s}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #128199}
  .btn.ghost{background:#16243d;color:var(--ink);box-shadow:0 5px 0 #0a1322}
  .btn.green{background:linear-gradient(180deg,var(--neon2),#3fd44f);color:#031;box-shadow:0 5px 0 #1f8a2a}
  .btn.red{background:linear-gradient(180deg,var(--danger),#d62f4d);color:#fff;box-shadow:0 5px 0 #8c1226}
  .btn.gold{background:linear-gradient(180deg,var(--acid),#e6b800);color:#221;box-shadow:0 5px 0 #9c7e00}
  .btn.sm{width:auto;display:inline-block;padding:10px 16px;font-size:15px;margin:4px}
  .btnrow{display:flex;gap:10px;margin-top:12px}

  .stations{display:grid;grid-template-columns:1fr;gap:14px;margin-top:6px}
  @media(min-width:620px){.stations{grid-template-columns:1fr 1fr}}
  .station{background:linear-gradient(180deg,#13203a,#0d1729);border:2px solid var(--line);
    border-radius:18px;padding:18px;cursor:pointer;text-align:center;transition:transform .12s,border-color .15s,box-shadow .15s;position:relative;overflow:hidden}
  .station:hover{transform:translateY(-5px);border-color:var(--neon);box-shadow:0 14px 30px rgba(57,230,255,.18)}
  .station .em{font-size:50px;filter:drop-shadow(0 0 14px rgba(57,230,255,.4))}
  .station b{display:block;font-size:18px;margin-top:6px}
  .station span{font-size:12.5px;color:#8fb3d9;display:block;margin-top:4px;line-height:1.4}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
  .tag{font-size:12px;font-weight:bold;padding:5px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--neon)}
  .muteBtn{background:#16243d;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:14px}

  canvas{display:block;border-radius:14px;background:#08101f;width:100%;touch-action:none}
  .lab{display:grid;gap:12px}
  @media(min-width:680px){.lab{grid-template-columns:1.25fr 1fr}}
  .shelf{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;align-content:start}
  .reagent{display:flex;align-items:center;gap:8px;background:#13203a;border:2px solid var(--line);
    border-radius:12px;padding:8px 9px;cursor:pointer;transition:transform .08s,border-color .12s;text-align:left}
  .reagent:hover{transform:translateY(-2px);border-color:var(--neon)}
  .reagent .rem{font-size:22px;flex:none}
  .reagent .rn{font-size:12.5px;font-weight:bold;line-height:1.1}
  .reagent .rf{font-size:10.5px;color:#8fb3d9}
  .info{background:#0c1424;border:2px solid var(--line);border-radius:13px;padding:13px;font-size:14px;line-height:1.5;min-height:64px}
  .info b{color:var(--acid)}
  .eq{font-family:'Courier New',monospace;background:#091020;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;color:var(--neon2);font-size:14px;word-break:break-word}
  .discCount{font-size:13px;color:#8fb3d9}
  .pillrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .pill{font-size:11px;padding:4px 9px;border-radius:999px;background:#0c1424;border:1px solid var(--line);color:#5b7da3}
  .pill.got{background:#0e2a16;border-color:#2fae50;color:var(--neon2)}
  .warn{color:var(--danger);font-weight:bold}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
  .tool{background:#13203a;border:2px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;font-size:14px;font-weight:bold;color:var(--ink)}
  .tool.active{border-color:var(--acid);color:var(--acid);box-shadow:0 0 12px rgba(255,225,77,.3)}
  input[type=range]{width:100%;accent-color:var(--neon)}
  .stateLbl{font-size:26px;font-weight:bold;text-align:center;letter-spacing:.05em}
  .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#000;border:2px solid var(--neon);color:var(--neon);
    padding:10px 20px;border-radius:999px;font-weight:bold;font-size:15px;opacity:0;transition:opacity .25s, top .25s;pointer-events:none;z-index:60;text-align:center}
  .toast.show{opacity:1;top:26px}
  .hud{display:flex;gap:10px;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
  .stat{flex:1;min-width:78px;background:#0c1424;border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center}
  .stat b{display:block;font-size:20px}
  .stat span{font-size:10px;color:#8fb3d9;text-transform:uppercase;letter-spacing:.06em}
  .streak.fire b{color:var(--acid);text-shadow:0 0 12px var(--acid)}
  .center{text-align:center}
  .small{font-size:13px;color:#8fb3d9;line-height:1.5}
  svg{width:100%;height:auto;display:block}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
  .glowbtn{animation:gl 1.6s infinite}
  @keyframes gl{0%,100%{box-shadow:0 5px 0 #1f8a2a,0 0 0 rgba(124,255,107,0)}50%{box-shadow:0 5px 0 #1f8a2a,0 0 22px rgba(124,255,107,.6)}}
  .pulse{animation:pulse .45s}
  @keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
  /* exam arena */
  .topicgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(min-width:620px){.topicgrid{grid-template-columns:1fr 1fr 1fr}}
  .topic{background:#13203a;border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:center;transition:transform .1s,border-color .12s;position:relative}
  .topic:hover{transform:translateY(-3px);border-color:var(--neon)}
  .topic .em{font-size:30px}
  .topic b{display:block;font-size:13.5px;margin-top:4px}
  .topic .score{position:absolute;top:6px;right:8px;font-size:11px;color:var(--neon2);font-weight:bold}
  .fighter{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .fighter .face{font-size:42px;flex:none;width:56px;text-align:center}
  .fighter .bars{flex:1}
  .fighter .nm{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
  .hpbar{height:16px;background:#0c1424;border-radius:10px;overflow:hidden;border:2px solid var(--line)}
  .hpbar>i{display:block;height:100%;transition:width .4s}
  .hp-enemy>i{background:linear-gradient(90deg,#d62f4d,#ff7d99)}
  .hp-self>i{background:linear-gradient(90deg,#2cb96a,#5dffa0)}
  .bubble{background:#0c1424;border:2px solid var(--line);border-radius:14px;padding:10px 13px;font-size:13.5px;color:#dcd6f5;margin:8px 0;font-style:italic}
  .q{font-size:19px;font-weight:bold;line-height:1.35;margin:8px 0 12px}
  .opts{display:grid;gap:9px}
  .opt{text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#13203a;color:var(--ink);font-size:15.5px;cursor:pointer;transition:transform .08s,background .12s;font-family:inherit}
  .opt:hover{background:#1b2c4a;transform:translateY(-2px)}
  .opt.correct{background:var(--neon2);color:#031;border-color:#2fae50;font-weight:bold}
  .opt.wrong{background:var(--danger);color:#fff;border-color:#d62f4d;font-weight:bold}
  .opt.dim{opacity:.4}
  .explain{margin-top:12px;background:#0c1424;border-left:5px solid var(--acid);border-radius:10px;padding:12px;font-size:14px;line-height:1.5;color:#dcd6f5;display:none}
  .explain b{color:var(--acid)}
  .report-row{display:flex;align-items:center;gap:10px;margin:8px 0}
  .report-row .name{width:130px;font-weight:bold;font-size:13px}
  .report-row .track{flex:1;height:14px;background:#0c1424;border-radius:8px;overflow:hidden;border:2px solid var(--line)}
  .report-row .track>i{display:block;height:100%}
  .report-row .pct{width:44px;text-align:right;font-weight:bold;font-size:13px}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="wrap"><div class="panel" id="app"></div></div>

<script>
const root=document.getElementById('app');
const toastEl=document.getElementById('toast');
let muted=false;
function toast(t,ms){toastEl.innerHTML=t;toastEl.classList.add('show');clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.classList.remove('show'),ms||1500)}

/* ---------------- SOUND ---------------- */
let actx;function AC(){actx=actx||new (window.AudioContext||window.webkitAudioContext)();return actx}
function tone(f,d,t,vol){if(muted)return;try{const a=AC();const o=a.createOscillator(),g=a.createGain();o.type=t||'square';o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(vol||.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.start();o.stop(a.currentTime+d)}catch(e){}}
function noise(d,vol,ff){if(muted)return;try{const a=AC();const n=a.sampleRate*d;const buf=a.createBuffer(1,n,a.sampleRate);const dt=buf.getChannelData(0);for(let i=0;i<n;i++)dt[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.5);const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=ff||2000;const g=a.createGain();g.gain.value=vol||.3;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}catch(e){}}
const SFX={fizz:()=>noise(1.0,.22,1600),pop:()=>{tone(700,.06);setTimeout(()=>tone(950,.07),50)},
  bang:()=>{noise(.5,.5,500);tone(70,.5,'sawtooth',.3)},whoosh:()=>noise(.7,.25,800),flame:()=>noise(.9,.3,1200),
  ding:()=>{tone(880,.1);setTimeout(()=>tone(1320,.16),90)},cut:()=>noise(.18,.25,3000),
  click:()=>tone(440,.04),win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.16),i*110))};
function toggleMute(){muted=!muted;document.querySelectorAll('#muteBtn').forEach(b=>b.textContent=muted?'🔇':'🔊')}
let raf=null;function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=null}}

/* color helpers */
function hx(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgb(r,g,b){return '#'+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('')}
function blend(c1,c2,t){const a=hx(c1),b=hx(c2);return rgb(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t)}

/* ====================================================================== */
/*  HUB                                                                   */
/* ====================================================================== */
function hub(){
  stopLoop();
  root.innerHTML=`
    <div class="topbar"><span class="tag">🔬 MAD LAB</span>
      <button class="muteBtn" id="muteBtn" onclick="toggleMute()">${muted?'🔇':'🔊'}</button></div>
    <h1>⚗️ MAD LAB ⚗️</h1>
    <div class="sub">Year 8 Science • Mix it. Cut it. Melt it. Then <span class="glow">ace the exam.</span></div>
    <div class="stations">
      <div class="station" onclick="SFX.click();chem()">
        <div class="em">⚗️</div><b>Reaction Chamber</b>
        <span>Mix chemicals, set them alight & test gases — combustion, displacement, EXPLOSIONS. 11 reactions to discover.</span></div>
      <div class="station" onclick="SFX.click();bio()">
        <div class="em">🐸</div><b>Dissection Bay</b>
        <span>Cut open a frog, explore the organs of digestion & breathing, then ace the labelling challenge.</span></div>
      <div class="station" onclick="SFX.click();matter()">
        <div class="em">🔥❄️</div><b>Matter Morpher</b>
        <span>Heat & cool molecules. Watch solid → liquid → gas happen with the particle model in real time.</span></div>
      <div class="station" onclick="SFX.click();arena()">
        <div class="em">🧠</div><b>Exam Arena</b>
        <span>Boss-battle quizzes across all 11 topics — straight from your knowledge organisers. Unlocks a Gap Report.</span></div>
      <div class="station" onclick="SFX.click();circuits()">
        <div class="em">⚡</div><b>Circuit Lab</b>
        <span>Build series & parallel circuits, flip the switch, break a bulb — watch the current flow and bulbs glow.</span></div>
      <div class="station" onclick="SFX.click();forcelab()">
        <div class="em">🧮</div><b>Force Lab</b>
        <span>Balance a seesaw with moments, then practise force calculations (pressure, work, weight…) with worked answers.</span></div>
      <div class="station" onclick="SFX.click();written()">
        <div class="em">📝</div><b>Written Exam</b>
        <span>1, 2 & 3-mark exam questions with mark schemes — type your answer and mark yourself.</span></div>
      <div class="station" onclick="SFX.click();prolab()">
        <div class="em">🧫</div><b>Pro Lab (Realistic)</b>
        <span>Test tubes, beakers, flasks, a Bunsen & a distillation rig + ~120 chemicals. Mix anything, distil bromine & chromyl chloride, run gas tests.</span></div>
      <div class="station" onclick="SFX.click();magnet()">
        <div class="em">🧲</div><b>Magnet Lab</b>
        <span>See real magnetic field lines, sprinkle iron filings, and watch two magnets attract or repel. Compasses line up live.</span></div>
      <div class="station" onclick="SFX.click();genetics()">
        <div class="em">🧬</div><b>Genetics Lab</b>
        <span>Build a Punnett square, pick the parents' genes and see the offspring ratios — plus how genetic modification works.</span></div>
    </div>
    <p class="small center" style="margin-top:14px">💡 Turn sound on for fizzes, pops & bangs. Everything works offline & saves your progress.</p>
  `;
}

/* ====================================================================== */
/*  STATION 1 — REACTION CHAMBER                                          */
/* ====================================================================== */
const REAGENTS={
  water:{n:"Water",f:"H₂O",em:"💧",c:"#5fb8ff"},
  acid:{n:"Hydrochloric Acid",f:"HCl",em:"🧪",c:"#fff07a"},
  base:{n:"Sodium Hydroxide",f:"NaOH",em:"🧴",c:"#ffc1ec"},
  indicator:{n:"Universal Indicator",f:"pH dye",em:"🌈",c:"#8fe06b"},
  magnesium:{n:"Magnesium",f:"Mg",em:"🔩",c:"#cdd6e6",solid:1},
  bakingsoda:{n:"Baking Soda",f:"NaHCO₃",em:"🧂",c:"#ffffff",solid:1},
  vinegar:{n:"Vinegar",f:"CH₃COOH",em:"🍶",c:"#f6e3a0"},
  sodium:{n:"Sodium metal",f:"Na",em:"⚪",c:"#e9e9e9",solid:1},
  coppersulfate:{n:"Copper Sulfate",f:"CuSO₄",em:"🔷",c:"#1f7bff"},
  iron:{n:"Iron nail",f:"Fe",em:"🔧",c:"#9aa3b0",solid:1},
  peroxide:{n:"Hydrogen Peroxide",f:"H₂O₂",em:"🫧",c:"#dff0ff"},
  catalyst:{n:"Catalyst (yeast)",f:"cat.",em:"🟤",c:"#caa15a",solid:1},
  methane:{n:"Methane gas",f:"CH₄",em:"💨",c:"#bfe9ff",solid:1},
  carbonate:{n:"Copper Carbonate",f:"CuCO₃",em:"🟢",c:"#3fa86b",solid:1},
  limewater:{n:"Limewater",f:"Ca(OH)₂",em:"🥛",c:"#eef7ff"},
};
const RX={
  "acid|base":{id:"neutral",name:"Neutralisation",eq:"HCl + NaOH → NaCl + H₂O",
    desc:"Acid + alkali cancel out → salt + water. It's <b>exothermic</b> (gives out heat) — the beaker warms up! 🌡️",fx:"heat",col:"#9fe6c0"},
  "acid|magnesium":{id:"acidmetal",name:"Acid + Metal",eq:"Mg + 2HCl → MgCl₂ + H₂",
    desc:"A reactive metal in acid <b>fizzes</b> and gives off <b>hydrogen gas</b> 🫧. A flame would make a squeaky <b>POP</b>!",fx:"fizz",col:"#eafff0"},
  "bakingsoda|vinegar":{id:"volcano",name:"Baking-Soda Volcano",eq:"NaHCO₃ + CH₃COOH → CO₂ + H₂O + salt",
    desc:"Acid + carbonate erupt in <b>carbon dioxide</b> foam 🌋. CO₂ is the gas making it fizz over. (Try the limewater test now!)",fx:"foam",col:"#fff7d6",co2:1},
  "sodium|water":{id:"boom",name:"Alkali Metal BOOM",eq:"2Na + 2H₂O → 2NaOH + H₂ (💥)",
    desc:"<span class='warn'>WHOA!</span> Group 1 metals react <b>violently</b> with water — so much heat the hydrogen <b>ignites</b>! 🔥 Never do this for real.",fx:"boom",col:"#ffd089"},
  "coppersulfate|iron":{id:"displace",name:"Displacement",eq:"Fe + CuSO₄ → FeSO₄ + Cu",
    desc:"Iron is <b>more reactive</b> than copper, so it kicks copper out of solution. Blue fades, orange copper coats the nail! 🟠",fx:"displace",col:"#7fcaa0"},
  "catalyst|peroxide":{id:"toothpaste",name:"Elephant's Toothpaste",eq:"2H₂O₂ → 2H₂O + O₂ (catalyst)",
    desc:"A <b>catalyst</b> speeds up the breakdown of peroxide, blasting out <b>oxygen</b> trapped in foam — a giant tower! 🦣🪥",fx:"toothpaste",col:"#eafaff"},
  "acid|indicator":{id:"red",name:"Indicator → RED",eq:"low pH (1–3) → red",
    desc:"Universal indicator turns <b>red</b> in a strong <b>acid</b>. Colour = pH! 🔴",fx:"recolor",col:"#ff5a4d"},
  "base|indicator":{id:"purple",name:"Indicator → PURPLE",eq:"high pH (12–14) → purple",
    desc:"Universal indicator turns <b>purple</b> in a strong <b>alkali</b>. 🟣",fx:"recolor",col:"#a25cff"},
};
const RX_TOTAL=11; // 8 above + combustion + thermal + limewater
let CH;
function chemLoadDisc(){try{return JSON.parse(localStorage.getItem('madlab_disc')||'[]')}catch(e){return[]}}
function chemSaveDisc(a){try{localStorage.setItem('madlab_disc',JSON.stringify(a))}catch(e){}}
const DISC_NAMES={neutral:"Neutralisation",acidmetal:"Acid + Metal",volcano:"Baking-Soda Volcano",boom:"Alkali Metal BOOM",
  displace:"Displacement",toothpaste:"Elephant's Toothpaste",red:"Indicator → RED",purple:"Indicator → PURPLE",
  combustion:"Combustion 🔥",thermal:"Thermal Decomposition",limetest:"Limewater CO₂ test"};

function chem(){
  stopLoop();const disc=chemLoadDisc();
  let shelf='';for(const k in REAGENTS){const r=REAGENTS[k];
    shelf+=`<button class="reagent" onclick="addReagent('${k}')"><span class="rem">${r.em}</span>
      <span><span class="rn">${r.n}</span><br><span class="rf">${r.f}</span></span></button>`;}
  let pills='';for(const id in DISC_NAMES){const got=disc.includes(id);
    pills+=`<span class="pill ${got?'got':''}">${got?'✅ '+DISC_NAMES[id]:'❓ ???'}</span>`}
  root.innerHTML=`
    <div class="topbar"><span class="tag">⚗️ Reaction Chamber</span>
      <button class="muteBtn" id="muteBtn" onclick="toggleMute()">${muted?'🔇':'🔊'}</button></div>
    <div class="lab">
      <div>
        <canvas id="beaker" width="420" height="380"></canvas>
        <div class="info" id="rxinfo">Click chemicals to pour them in. Combine the right pair — or hit 🔥 <b>Apply heat</b> — to trigger a reaction!</div>
        <div class="btnrow">
          <button class="btn gold sm" style="margin:0;flex:1" onclick="applyHeat()">🔥 Apply heat / flame</button>
          <button class="btn red sm" style="margin:0;flex:1" onclick="cleanBeaker()">🚿 Clean</button>
        </div>
        <div class="topbar" style="margin-top:8px"><span class="discCount">Discoveries: <b id="discN">${disc.length}</b>/${RX_TOTAL}</span></div>
        <div class="pillrow" id="pills">${pills}</div>
      </div>
      <div class="shelf">${shelf}</div>
    </div>
    <button class="btn ghost" onclick="SFX.click();hub()">⬅️ Back to lab</button>
  `;
  const cv=document.getElementById('beaker');
  CH={cv,ctx:cv.getContext('2d'),contents:[],reacted:[],level:0,targetLevel:0,
      color:"#0a2036",targetColor:"#0a2036",bubbles:[],parts:[],foam:0,targetFoam:0,
      heat:0,targetHeat:0,copperNail:0,shakeT:0,flameT:0,co2:false,cloudy:0,t:0,disc};
  chemLoop();
}
function setInfo(h){const e=document.getElementById('rxinfo');if(e)e.innerHTML=h}
function gotDisc(id){if(!CH.disc.includes(id)){CH.disc.push(id);chemSaveDisc(CH.disc);SFX.ding();
  toast("🧪 Discovery: <b>"+DISC_NAMES[id]+"</b>!");const dN=document.getElementById('discN');if(dN)dN.textContent=CH.disc.length;refreshPills();}}
function refreshPills(){const p=document.getElementById('pills');if(!p)return;let s='';
  for(const id in DISC_NAMES){const got=CH.disc.includes(id);s+=`<span class="pill ${got?'got':''}">${got?'✅ '+DISC_NAMES[id]:'❓ ???'}</span>`}p.innerHTML=s;}

function addReagent(k){
  if(!CH)return;const r=REAGENTS[k];SFX.whoosh();
  if(!r.solid){CH.targetLevel=Math.min(0.62,CH.targetLevel+0.16);CH.targetColor=blend(CH.targetColor,r.c,0.45)}
  else CH.targetLevel=Math.max(CH.targetLevel,0.2);
  for(let i=0;i<10;i++)CH.bubbles.push(mkBubble());
  if(!CH.contents.includes(k))CH.contents.push(k);
  setInfo(`Added <b>${r.n}</b> (${r.f}). ${CH.contents.length<2?"Add one more thing…":"Mixing…"}`);
  // limewater test for CO2
  if(k==='limewater'&&CH.co2){CH.cloudy=1;CH.targetColor='#dfe9f0';gotDisc('limetest');
    setInfo(`<b>Limewater turned cloudy/milky!</b> ✅ That confirms the gas produced was <b>carbon dioxide</b>. This is the standard test for CO₂.<div class="eq">CO₂ + limewater → cloudy white</div>`);return;}
  for(const other of CH.contents){if(other!==k)tryReaction(k,other);}
}
function tryReaction(a,b){const key=[a,b].sort().join('|');const rx=RX[key];if(!rx)return;
  if(CH.reacted.includes(rx.id))return;CH.reacted.push(rx.id);
  if(rx.co2)CH.co2=true;triggerFX(rx);gotDisc(rx.id);
  setInfo(`<b>${rx.name}!</b> ${rx.desc}<div class="eq">${rx.eq}</div>`);}
function applyHeat(){
  if(!CH)return;SFX.flame();CH.flameT=40;CH.targetHeat=1;
  for(let i=0;i<30;i++)CH.parts.push({x:180+Math.random()*60,y:90,vx:(Math.random()-.5)*2,vy:-2-Math.random()*3,life:1,
    c:['#ffd089','#ff7a3c','#ffe14d'][Math.floor(Math.random()*3)],r:3+Math.random()*4});
  if(CH.contents.includes('methane')){
    if(!CH.reacted.includes('combustion')){CH.reacted.push('combustion');CH.co2=true;CH.shakeT=10;SFX.bang();
      setInfo(`<b>Combustion! 🔥</b> Burning a fuel (methane) in <b>oxygen</b> releases energy and makes <b>carbon dioxide + water</b>. It's <b>exothermic</b>. (Test the gas with limewater!)<div class="eq">methane + oxygen → carbon dioxide + water</div>`);
      gotDisc('combustion');}
  } else if(CH.contents.includes('carbonate')){
    if(!CH.reacted.includes('thermal')){CH.reacted.push('thermal');CH.co2=true;
      CH.targetColor=blend(CH.targetColor,'#222',0.3);for(let i=0;i<20;i++)CH.bubbles.push(mkBubble(0.5));
      setInfo(`<b>Thermal decomposition!</b> Heat <b>breaks down</b> the metal carbonate into a metal oxide + <b>carbon dioxide</b>. (Test with limewater!)<div class="eq">copper carbonate → copper oxide + carbon dioxide</div>`);
      gotDisc('thermal');}
  } else {
    setInfo("🔥 You heat the beaker… add a <b>fuel (methane)</b> to see combustion, or a <b>metal carbonate</b> for thermal decomposition!");
  }
}
function triggerFX(rx){switch(rx.fx){
  case "heat":CH.targetColor=blend(CH.targetColor,rx.col,0.6);CH.targetHeat=1;for(let i=0;i<24;i++)CH.bubbles.push(mkBubble(0.4));break;
  case "fizz":CH.fizzing=true;SFX.fizz();setTimeout(()=>CH.fizzing&&SFX.pop(),900);CH.targetColor=blend(CH.targetColor,rx.col,0.4);break;
  case "foam":CH.targetFoam=1;CH.fizzing=true;SFX.fizz();CH.targetColor=blend(CH.targetColor,rx.col,0.4);break;
  case "boom":CH.shakeT=22;SFX.bang();explode();CH.targetColor='#ff9a3c';CH.targetLevel=Math.min(CH.targetLevel,0.25);break;
  case "displace":CH.displacing=true;CH.copperNail=0;CH.targetColor=rx.col;break;
  case "toothpaste":CH.targetFoam=1.6;CH.fizzing=true;SFX.fizz();setTimeout(()=>SFX.fizz(),700);CH.targetColor=blend(CH.targetColor,rx.col,0.5);break;
  case "recolor":CH.targetColor=rx.col;CH.targetFoam=0;for(let i=0;i<14;i++)CH.bubbles.push(mkBubble());SFX.pop();break;}}
function explode(){for(let i=0;i<60;i++){const a=Math.random()*6.28,s=2+Math.random()*6;
  CH.parts.push({x:210,y:230,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,c:['#ffd089','#ff7a3c','#ffe14d','#ff4d4d'][Math.floor(Math.random()*4)],r:3+Math.random()*4})}}
function mkBubble(sp){return {x:130+Math.random()*160,y:330,r:2+Math.random()*5,vy:-(0.6+Math.random()*1.4)*(sp?2:1),wob:Math.random()*6.28}}
function cleanBeaker(){if(!CH)return;SFX.whoosh();Object.assign(CH,{contents:[],reacted:[],targetLevel:0,targetColor:'#0a2036',
  targetFoam:0,foam:0,targetHeat:0,heat:0,fizzing:false,displacing:false,copperNail:0,bubbles:[],parts:[],co2:false,cloudy:0,flameT:0});
  setInfo("Beaker rinsed. 🚿 Fresh start — what'll you make?");}

function chemLoop(){
  if(!CH)return;const {ctx,cv}=CH;CH.t++;
  CH.level+=(CH.targetLevel-CH.level)*0.08;CH.foam+=(CH.targetFoam-CH.foam)*0.06;CH.heat+=(CH.targetHeat-CH.heat)*0.05;
  CH.color=blend(CH.color,CH.targetColor,0.06);
  if(CH.displacing){CH.copperNail=Math.min(1,CH.copperNail+0.004);CH.color=blend(CH.color,'#7fcaa0',0.01)}
  const W=cv.width,H=cv.height;let sx=0;if(CH.shakeT>0){sx=(Math.random()-.5)*CH.shakeT;CH.shakeT*=0.9;if(CH.shakeT<0.5)CH.shakeT=0}
  ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(sx,0);
  const bx=W/2;const left=120,right=300,top=70,bot=350,innerL=left+8,innerR=right-8;
  const liqTop=bot-(bot-top-20)*CH.level;
  if(CH.heat>0.02){const g=ctx.createRadialGradient(bx,360,5,bx,360,120);g.addColorStop(0,`rgba(255,120,40,${.4*CH.heat})`);g.addColorStop(1,'rgba(255,120,40,0)');ctx.fillStyle=g;ctx.fillRect(0,250,W,H-250)}
  // bunsen flame under beaker while heating
  if(CH.flameT>0){CH.flameT--;ctx.save();for(let i=0;i<3;i++){ctx.fillStyle=['#3a7bff','#ffae3c','#ffe14d'][i];ctx.globalAlpha=.7;
    ctx.beginPath();ctx.ellipse(bx,360+ i*4,14-i*4,30-i*8,0,0,6.28);ctx.fill()}ctx.restore();ctx.globalAlpha=1}
  if(CH.level>0.01){ctx.fillStyle=CH.color;ctx.beginPath();ctx.moveTo(innerL,liqTop);
    for(let x=innerL;x<=innerR;x+=6){const y=liqTop+Math.sin((x*0.06)+CH.t*0.08)*3;ctx.lineTo(x,y)}
    ctx.lineTo(innerR,bot-6);ctx.lineTo(innerL,bot-6);ctx.closePath();ctx.fill();
    if(CH.cloudy>0){ctx.fillStyle='rgba(255,255,255,'+(0.5*CH.cloudy)+')';ctx.fillRect(innerL,liqTop,innerR-innerL,bot-6-liqTop)}
    ctx.fillStyle='rgba(255,255,255,.10)';ctx.fillRect(innerL,liqTop+6,innerR-innerL,8)}
  if(CH.contents.includes('iron')&&CH.level>0.1){ctx.save();ctx.translate(bx+30,liqTop+20);ctx.rotate(0.5);
    ctx.fillStyle=CH.copperNail>0?blend('#9aa3b0','#c2622e',CH.copperNail):'#9aa3b0';ctx.fillRect(-5,0,10,80);ctx.fillRect(-9,-4,18,8);ctx.restore()}
  if(CH.fizzing&&CH.t%3===0&&CH.level>0.05)CH.bubbles.push(mkBubble());
  ctx.fillStyle='rgba(255,255,255,.55)';
  CH.bubbles=CH.bubbles.filter(b=>{b.y+=b.vy;b.wob+=0.2;b.x+=Math.sin(b.wob)*0.6;if(b.y<liqTop+2||b.y<top)return false;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.28);ctx.fill();return true});
  if(CH.foam>0.02){const fcol=blend(CH.color,'#ffffff',0.55);const cnt=Math.floor(60*CH.foam);
    for(let i=0;i<cnt;i++){const fx=innerL+Math.random()*(innerR-innerL);const fy=liqTop-Math.random()*(80*CH.foam)-(CH.foam>1?Math.random()*120*(CH.foam-1):0);
      ctx.fillStyle=fcol;ctx.globalAlpha=.85;ctx.beginPath();ctx.arc(fx,fy,4+Math.random()*7,0,6.28);ctx.fill()}ctx.globalAlpha=1}
  CH.parts=CH.parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life-=0.02;if(p.life<=0)return false;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();ctx.globalAlpha=1;return true});
  ctx.lineWidth=5;ctx.strokeStyle='rgba(160,210,255,.55)';ctx.beginPath();
  ctx.moveTo(left-10,top-8);ctx.lineTo(left,top+4);ctx.lineTo(left,bot);ctx.lineTo(right,bot);ctx.lineTo(right,top+4);ctx.lineTo(right+10,top-8);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(left+14,top+30);ctx.lineTo(left+14,bot-20);ctx.stroke();
  ctx.strokeStyle='rgba(160,210,255,.3)';ctx.lineWidth=2;for(let i=1;i<=4;i++){const y=bot-(bot-top-20)*(i/6);ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(left+16,y);ctx.stroke()}
  // thermometer
  const x=W-40,y=90,heat=CH.heat;ctx.fillStyle='rgba(160,210,255,.4)';ctx.fillRect(x-5,y,10,160);ctx.beginPath();ctx.arc(x,y+170,15,0,6.28);ctx.fill();
  ctx.fillStyle=heat>0.5?'#ff4d4d':'#5fb8ff';ctx.beginPath();ctx.arc(x,y+170,10,0,6.28);ctx.fill();ctx.fillRect(x-3,y+150-(heat*110),6,heat*110+20);
  ctx.fillStyle='#8fb3d9';ctx.font='11px Trebuchet MS';ctx.fillText(heat>0.5?'HOT🔥':'cool',x-12,y-6);
  ctx.restore();raf=requestAnimationFrame(chemLoop);
}

const ORGANS=[

  {id:"lungs",name:"Lungs",em:"🫁",fn:"Where gas exchange happens — oxygen in, carbon dioxide out. Air reaches the alveoli (air sacs).",job:"do gas exchange (breathing)"},

function organShape(o){const shapes={
  heart:`<path d="M210 130 q-22 -26 -38 -4 q-14 22 38 50 q52 -28 38 -50 q-16 -22 -38 4z" fill="#d23b4f"/>`,
  lungs:`<ellipse cx="178" cy="185" rx="24" ry="38" fill="#e89bb0"/><ellipse cx="242" cy="185" rx="24" ry="38" fill="#e89bb0"/>`,
  liver:`<path d="M140 200 q70 -22 96 -2 q-6 34 -52 40 q-44 2 -44 -38z" fill="#8a4a2b"/>`,
  stomach:`<path d="M236 200 q40 6 30 50 q-10 36 -48 22 q-26 -12 -6 -44 q12 -22 24 -28z" fill="#b85ea0"/>`,
  intestine:`<path d="M170 260 q-14 24 16 28 q40 4 18 28 q-28 18 8 30 q40 10 20 34" fill="none" stroke="#e0a24e" stroke-width="15" stroke-linecap="round"/>`};
  return `<g class="organ" data-id="${o.id}" style="cursor:pointer" onclick="clickOrgan('${o.id}')">${shapes[o.id]}</g>`}
function wireScalpel(){const svg=document.getElementById('frog');const sc=document.getElementById('scalpel');if(!sc)return;
  let dragging=false,startY=0,traveled=0;
  const pt=(e)=>{const r=svg.getBoundingClientRect();const cy=(e.touches?e.touches[0].clientY:e.clientY);return (cy-r.top)/r.height*480};
  const down=(e)=>{dragging=true;startY=pt(e);sc.style.cursor='grabbing';e.preventDefault()};
  const move=(e)=>{if(!dragging)return;const y=pt(e);const dy=y-startY;startY=y;
    if(y>110&&y<380){traveled+=Math.abs(dy);const cur=parseFloat(sc.getAttribute('data-y')||40);const ny=Math.max(40,Math.min(330,cur+dy));
      sc.setAttribute('transform',`translate(-95,${ny-40})`);sc.setAttribute('data-y',ny);if(Math.random()<0.25)SFX.cut();if(traveled>200)openFrog()}};
  const up=()=>{dragging=false;if(sc)sc.style.cursor='grab'};
  sc.addEventListener('mousedown',down);window.addEventListener('mousemove',move);window.addEventListener('mouseup',up);
  sc.addEventListener('touchstart',down,{passive:false});window.addEventListener('touchmove',move,{passive:false});window.addEventListener('touchend',up);}
function openFrog(){if(BIO.opened)return;SFX.cut();SFX.whoosh();BIO.opened=true;renderBio();setTimeout(()=>toast("🔬 Incision complete! Explore the organs."),300)}

let MT;
function matter(){stopLoop();
  root.innerHTML=`
    <div class="topbar"><span class="tag">🔥❄️ Matter Morpher</span><button class="muteBtn" id="muteBtn" onclick="toggleMute()">${muted?'🔇':'🔊'}</button></div>
    <div class="stateLbl" id="stateLbl">❄️ SOLID (ice)</div>
    <div class="small center" id="stateDesc" style="margin-bottom:8px"></div>
    <canvas id="mt" width="600" height="320"></canvas>
    <div style="display:flex;align-items:center;gap:10px;margin-top:10px"><span>❄️</span><input type="range" id="temp" min="0" max="100" value="8" oninput="MT.setTemp(this.value)"><span>🔥</span></div>
    <div class="center small" id="tempReadout">Temperature: 8°  •  drag to add/remove heat energy</div>
    <div class="toolbar" style="margin-top:8px">
      <button class="tool" onclick="MT.setTemp(8);document.getElementById('temp').value=8">❄️ Freeze</button>
      <button class="tool" onclick="MT.setTemp(50);document.getElementById('temp').value=50">💧 Melt</button>
      <button class="tool" onclick="MT.setTemp(92);document.getElementById('temp').value=92">💨 Boil</button></div>
    <button class="btn ghost" onclick="SFX.click();hub()">⬅️ Back to lab</button>`;
  const cv=document.getElementById('mt'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
  const cols=8,rows=8,parts=[],spacing=40,ox=W/2-(cols-1)*spacing/2,oy=H-rows*spacing-20;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)parts.push({hx:ox+c*spacing,hy:oy+r*spacing,x:ox+c*spacing,y:oy+r*spacing,vx:0,vy:0});
  MT={cv,ctx,parts,temp:8,setTemp(v){this.temp=+v;const lbl=document.getElementById('stateLbl'),d=document.getElementById('stateDesc'),rd=document.getElementById('tempReadout');
    if(rd)rd.textContent=`Temperature: ${v}°  •  heat energy = particle speed`;
    if(this.temp<33){lbl.innerHTML="❄️ SOLID (ice)";d.innerHTML="Particles <b>locked in a fixed pattern</b>, only vibrating. Fixed shape & volume."}
    else if(this.temp<66){lbl.innerHTML="💧 LIQUID (water)";d.innerHTML="Particles <b>close but sliding</b> past each other. Fixed volume, takes the container's shape."}
    else{lbl.innerHTML="💨 GAS (steam)";d.innerHTML="Particles have <b>lots of energy</b>, flying & bouncing off walls. Fills all the space!"}if(Math.random()<.5)SFX.click()}};
  MT.setTemp(8);mtLoop();}
function mtLoop(){if(!MT)return;const {ctx,cv,parts,temp}=MT,W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);const warm=temp/100;
  ctx.fillStyle=`rgba(${20+warm*60},${30-warm*10},${60-warm*40},0.25)`;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(120,180,255,.25)';ctx.lineWidth=3;ctx.strokeRect(20,20,W-40,H-40);
  const pcol=temp<33?'#7fd2ff':temp<66?'#4d96ff':'#ff7a5c';
  parts.forEach(p=>{
    if(temp<33){const amp=temp*0.08;p.vx+=(p.hx-p.x)*0.08;p.vy+=(p.hy-p.y)*0.08;p.vx*=0.6;p.vy*=0.6;p.x+=p.vx+(Math.random()-.5)*amp;p.y+=p.vy+(Math.random()-.5)*amp}
    else if(temp<66){const e=(temp-33)/33;p.vy+=0.25;p.vx+=(Math.random()-.5)*e*2;p.vy+=(Math.random()-.5)*e*1.2;p.vx*=0.92;p.vy*=0.92;p.x+=p.vx;p.y+=p.vy;if(p.y>H-32){p.y=H-32;p.vy*=-0.3}}
    else{const e=(temp-66)/34;if(Math.abs(p.vx)<0.5&&Math.abs(p.vy)<0.5){const a=Math.random()*6.28;p.vx=Math.cos(a)*4;p.vy=Math.sin(a)*4}p.vx+=(Math.random()-.5)*e*1.5;p.vy+=(Math.random()-.5)*e*1.5;const mx=2+e*5,sp=Math.hypot(p.vx,p.vy);if(sp>mx){p.vx*=mx/sp;p.vy*=mx/sp}p.x+=p.vx;p.y+=p.vy}
    if(p.x<28){p.x=28;p.vx=Math.abs(p.vx)}if(p.x>W-28){p.x=W-28;p.vx=-Math.abs(p.vx)}if(p.y<28){p.y=28;p.vy=Math.abs(p.vy)}if(p.y>H-28){p.y=H-28;p.vy=-Math.abs(p.vy)*0.5}
    ctx.beginPath();ctx.arc(p.x,p.y,9,0,6.28);const g=ctx.createRadialGradient(p.x-3,p.y-3,1,p.x,p.y,10);g.addColorStop(0,'#fff');g.addColorStop(.4,pcol);g.addColorStop(1,pcol);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;ctx.stroke()});
  raf=requestAnimationFrame(mtLoop);}

function btAnswer(btn,correct,q){if(BT.answered)return;BT.answered=true;
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===q.o[q.a])b.classList.add('correct');else b.classList.add('dim')});
  const ex=document.getElementById('explain');ex.innerHTML=(correct?"✅ <b>HIT!</b> ":"❌ <b>Answer:</b> ")+q.w;ex.style.display='block';
  if(correct){BT.correct++;BT.streak++;BT.best=Math.max(BT.best,BT.streak);const crit=BT.streak>=3;BT.bossHP=Math.max(0,BT.bossHP-1);
    BT.score+=100+(BT.streak-1)*25;if(crit){SFX.win();toast("💥 CRITICAL! Combo x"+BT.streak)}else{SFX.ding();toast("✅ +"+(100+(BT.streak-1)*25))}}
  else{BT.streak=0;BT.hp--;btn.classList.remove('dim');btn.classList.add('wrong');SFX.pop();toast("💢 Boss hits back! Read the answer 👇")}
  document.querySelector('.hp-enemy>i').style.width=Math.max(0,BT.bossHP/BT.bossMax*100)+'%';

function battleWin(){SFX.win();saveTopicScore(BT.t.key,BT.correct,BT.qs.length);const pct=Math.round(BT.correct/BT.qs.length*100);
  root.innerHTML=`<h1>🏆 ${BT.t.boss} DEFEATED!</h1>

  const e=document.getElementById('clinfo');if(!e)return;let t;

  else if(CL.mode==='series')t=CL.broken?"<b>Series + broken bulb:</b> there's only ONE loop, so breaking one bulb breaks the whole circuit — <b>both bulbs go out</b>. ❌":"<b>Series circuit:</b> one single loop. The cell's voltage is <b>shared</b>, so two bulbs are <b>dimmer</b>. The current is the <b>same</b> everywhere. An <b>ammeter</b> (current, A) goes in series.";

function clLoop(){
  if(!CL)return;const {ctx,cv}=CL,W=cv.width,H=cv.height,L=80,R=480,T=80,Bm=220;
  ctx.clearRect(0,0,W,H);
  const flowing=CL.closed && !(CL.mode==='series'&&CL.broken);
  CL.phase=(CL.phase+(flowing?0.012:0))%1;
  let segs,bulbs;
  if(CL.mode==='series'){
    segs=[{a:[L,Bm],b:[L,T]},{a:[L,T],b:[R,T]},{a:[R,T],b:[R,Bm]},{a:[R,Bm],b:[L,Bm],sw:1}];
    bulbs=[{x:200,y:T,on:!CL.broken,br:0.5},{x:360,y:T,on:!CL.broken,br:0.5}];
  } else {
    segs=[{a:[L,Bm],b:[L,T]},{a:[L,T],b:[R,T]},{a:[R,T],b:[R,Bm]},{a:[R,Bm],b:[L,Bm],sw:1},
          {a:[200,T],b:[200,Bm],dead:CL.broken},{a:[360,T],b:[360,Bm]}];
    bulbs=[{x:200,y:150,on:!CL.broken,br:1},{x:360,y:150,on:true,br:1}];
  }
  segs.forEach(s=>{ if(s.dead)return;
    ctx.strokeStyle=flowing?'#39e6ff':'#3a5070';ctx.lineWidth=4;
    if(s.sw){ctx.beginPath();ctx.moveTo(s.a[0],s.a[1]);ctx.lineTo(300,Bm);ctx.stroke();
      ctx.beginPath();ctx.moveTo(260,Bm);ctx.lineTo(s.b[0],s.b[1]);ctx.stroke();
      ctx.strokeStyle='#cfd6e6';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(300,Bm);if(CL.closed)ctx.lineTo(260,Bm);else ctx.lineTo(272,Bm-26);ctx.stroke();
      ctx.fillStyle='#cfd6e6';ctx.beginPath();ctx.arc(300,Bm,4,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(260,Bm,4,0,6.28);ctx.fill();
    } else {ctx.beginPath();ctx.moveTo(s.a[0],s.a[1]);ctx.lineTo(s.b[0],s.b[1]);ctx.stroke();}
  });
  if(CL.mode==='parallel'&&CL.broken){ctx.strokeStyle='#5a3030';ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(200,T+30);ctx.lineTo(200,Bm-30);ctx.stroke();ctx.setLineDash([])}
  if(flowing){ctx.fillStyle='#ffe14d';segs.forEach(s=>{if(s.sw||s.dead)return;const dx=s.b[0]-s.a[0],dy=s.b[1]-s.a[1],len=Math.hypot(dx,dy),n=Math.max(2,Math.round(len/45));
    for(let k=0;k<n;k++){const f=((CL.phase+k/n)%1);ctx.beginPath();ctx.arc(s.a[0]+dx*f,s.a[1]+dy*f,3,0,6.28);ctx.fill()}});}
  ctx.strokeStyle='#cfd6e6';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(L-12,140);ctx.lineTo(L+12,140);ctx.stroke();ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(L-7,156);ctx.lineTo(L+7,156);ctx.stroke();
  ctx.fillStyle='#8fb3d9';ctx.font='12px Trebuchet MS';ctx.fillText('cell',L-36,150);ctx.fillText('switch',250,Bm+24);
  bulbs.forEach((b,bi)=>{const lit=flowing&&b.on;
    if(lit){const g=ctx.createRadialGradient(b.x,b.y,2,b.x,b.y,26);g.addColorStop(0,'rgba(255,234,120,.9)');g.addColorStop(1,'rgba(255,234,120,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,26,0,6.28);ctx.fill();}
    ctx.strokeStyle=lit?'#ffd23f':'#6b7686';ctx.lineWidth=3;ctx.fillStyle=lit?'#fff7cf':'#1a2740';ctx.beginPath();ctx.arc(b.x,b.y,11,0,6.28);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(b.x-7,b.y-7);ctx.lineTo(b.x+7,b.y+7);ctx.moveTo(b.x+7,b.y-7);ctx.lineTo(b.x-7,b.y+7);ctx.stroke();
    ctx.fillStyle='#8fb3d9';ctx.fillText('bulb '+(bi+1),b.x-18,b.y+30);
  });
  raf=requestAnimationFrame(clLoop);
}

    grid+=`<div class="topic" onclick="SFX.click();wrStart('${k}')"><div class="em">${em}</div><b>${k}</b></div>`});
  root.innerHTML=`<div class="topbar"><span class="tag">📝 Written Exam</span><button class="muteBtn" id="muteBtn" onclick="toggleMute()">${muted?'🔇':'🔊'}</button></div>
   <h2 class="center">Written Questions</h2><div class="sub">1, 2 & 3-mark exam-style questions. Type your answer, reveal the mark scheme, then mark yourself honestly.</div>
   <div class="topicgrid">${grid}</div>
   <button class="btn ghost" onclick="SFX.click();hub()">⬅️ Back to lab</button>`;}
function wrStart(k){WR={k,list:WRITTEN[k],i:0,marks:0,max:WRITTEN[k].reduce((a,q)=>a+q.m,0)};wrQ();}
function wrQ(){
  if(WR.i>=WR.list.length)return wrResult();const q=WR.list[WR.i];
  root.innerHTML=`<div class="topbar"><span class="tag">📝 ${WR.k} ${WR.i+1}/${WR.list.length}</span><button class="muteBtn" id="muteBtn" onclick="toggleMute()">${muted?'🔇':'🔊'}</button></div>
   <div class="hud"><div class="stat"><b>${WR.marks}</b><span>Marks so far</span></div><div class="stat"><b>${q.m}</b><span>This Q</span></div></div>
   <div class="q">[${q.m} mark${q.m>1?'s':''}] ${q.q}</div>
   <textarea id="wrans" rows="4" placeholder="Write your answer here (optional — great for practice)..." style="width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:#0c1424;color:var(--ink);font-size:15px;font-family:inherit"></textarea>
   <button class="btn" id="wrrev" onclick="wrReveal()">👀 Reveal mark scheme</button>
   <div class="explain" id="wrms"></div><div id="wrmark"></div>
   <button class="btn ghost" onclick="SFX.click();written()">⬅️ Topics</button>`;}
function wrReveal(){const q=WR.list[WR.i];const ms=document.getElementById('wrms');
  ms.innerHTML="<b>Mark scheme (1 mark per point):</b><ul style='margin:6px 0 0 18px'>"+q.s.map(p=>`<li style='margin:4px 0'>${p}</li>`).join('')+"</ul>";
  ms.style.display='block';document.getElementById('wrrev').style.display='none';SFX.click();
  let btns='';for(let m=0;m<=q.m;m++)btns+=`<button class="btn sm ${m===q.m?'green':'ghost'}" onclick="wrScore(${m})">${m}</button>`;
  document.getElementById('wrmark').innerHTML=`<div class="small" style="margin-top:10px">How many marks did you give yourself?</div><div>${btns}</div>`;}
function wrScore(m){WR.marks+=m;SFX.ding();WR.i++;wrQ();}
function wrResult(){const pct=Math.round(WR.marks/WR.max*100);SFX.win();
  root.innerHTML=`<h1>📝 ${WR.marks}/${WR.max} marks</h1><div class="center" style="font-size:54px">${pct>=80?'🏆':pct>=50?'💪':'📚'}</div>
   <div class="sub">${WR.k} • ${pct}%</div>
   <p class="center small">${pct>=80?'Exam-ready on this topic!':pct>=50?'Solid — tighten up the points you missed.':'Re-read the knowledge organiser and try again!'}</p>
   <button class="btn" onclick="SFX.click();wrStart('${WR.k}')">🔁 Retry topic</button>
   <button class="btn ghost" onclick="SFX.click();written()">⬅️ Topics</button>`;}

function refreshShelf(){const el=document.getElementById('shelfitems');if(!el)return;const q=PRO.search.toLowerCase();

  el.innerHTML=items.map(id=>{const c=PCHEM[id];return `<button class="reagent" style="padding:7px 8px" onclick="proAdd('${id}')"><span class="rem" style="font-size:18px">${catEmoji(c.cat)}</span><span><span class="rn">${c.n}</span><br><span class="rf">${c.f}</span></span></button>`}).join('');}

function proAcidity(){const cs=PRO.contents.map(id=>PCHEM[id]);

  if(ind==='litmus')return ac==='acid'?'#e8554d':ac==='alkali'?'#3d6bff':'#9b6bd1';
  if(ind==='phenol')return ac==='alkali'?'#ff5ea8':'#efe9f0';
  if(ind==='methyl')return ac==='acid'?'#ff4136':ac==='alkali'?'#ffbf3c':'#ff8a3c';

}

  ctx.fillStyle='#8fb3d9';ctx.font='10px Trebuchet MS';ctx.fillText('Liebig condenser',ax+6,ay-10);
  // droplets running into the receiver
  if(PRO.distilling&&PRO.distillate){ctx.fillStyle=PRO.distillate.c;for(let k=0;k<4;k++){const t=((PRO.t*0.018+k*0.25)%1);ctx.beginPath();ctx.arc(ax+(cx2-ax)*t,(ay-3)+((cy2-3)-(ay-3))*t,2.6,0,6.28);ctx.fill()}}
  // ---- receiver (conical flask, fills bottom-up) ----
  const rx=356, rTop=242, rBot=350, hTop=12, hBot=40;
  if(PRO.distillate&&PRO.distillate.amount>0.005){const amt=Math.min(1,PRO.distillate.amount/0.7);
    const liqY=rBot-(rBot-rTop-6)*amt;const wTop=hBot+(hTop-hBot)*((liqY-rTop)/(rBot-rTop));
    ctx.fillStyle=PRO.distillate.c;ctx.beginPath();ctx.moveTo(rx-wTop,liqY);ctx.lineTo(rx+wTop,liqY);ctx.lineTo(rx+hBot,rBot-3);ctx.lineTo(rx-hBot,rBot-3);ctx.closePath();ctx.fill();}
  ctx.strokeStyle='rgba(160,210,255,.7)';ctx.lineWidth=4;ctx.beginPath();
  ctx.moveTo(rx-hTop,rTop);ctx.lineTo(rx-hBot,rBot);ctx.lineTo(rx+hBot,rBot);ctx.lineTo(rx+hTop,rTop);
  ctx.moveTo(rx-hTop,rTop);ctx.lineTo(rx-hTop,rTop-14);ctx.moveTo(rx+hTop,rTop);ctx.lineTo(rx+hTop,rTop-14);ctx.stroke();
  ctx.fillStyle='#8fb3d9';ctx.font='11px Trebuchet MS';ctx.fillText('receiver',rx-24,rBot+16);
  // labels
  ctx.fillStyle='#cfe0f5';ctx.font='12px Trebuchet MS';ctx.fillText(PRO.contents.length+' in flask',16,26);
  if(PRO.distillate&&PRO.distillate.amount>0.02){const pale=PRO.distillate.c==='#dfeeff'||PRO.distillate.c==='#cfe6ff';ctx.fillStyle=pale?'#bcd6ee':'#ff9a9a';ctx.font='bold 13px Trebuchet MS';ctx.fillText('collected: '+PRO.distillate.name,150,58);}
  ctx.restore();
}

/* ===================== STATION 9 — MAGNET LAB ===================== */
let MG;
function magnet(){stopLoop();MG={flip:false,filings:false,second:false,repel:false};drawMG();}
function drawMG(){
  root.innerHTML=`
   <div class="topbar"><span class="tag">🧲 Magnet Lab</span><button class="muteBtn" id="muteBtn" onclick="toggleMute()">${muted?'🔇':'🔊'}</button></div>
   <canvas id="mg" width="560" height="320"></canvas>
   <div class="toolbar" style="margin-top:10px">
     <button class="tool" onclick="MG.flip=!MG.flip;SFX.click();drawMG()">🔄 Flip magnet</button>
     <button class="tool" onclick="MG.filings=!MG.filings;SFX.click();drawMG()">${MG.filings?'🧭 Compasses':'⚙️ Iron filings'}</button>
     <button class="tool" onclick="MG.second=!MG.second;SFX.click();drawMG()">${MG.second?'➖ One magnet':'➕ Second magnet'}</button>
     ${MG.second?`<button class="tool" onclick="MG.repel=!MG.repel;SFX.click();drawMG()">${MG.repel?'🚫 Repelling':'🧲 Attracting'}</button>`:''}
   </div>
   <div class="info" id="mginfo"></div>
   <button class="btn ghost" onclick="SFX.click();hub()">⬅️ Back to lab</button>`;
  const cv=document.getElementById('mg');MG.cv=cv;MG.ctx=cv.getContext('2d');MG.t=0;
  document.getElementById('mginfo').innerHTML=MG.second?(MG.repel?"Two <b>like poles</b> facing (N–N or S–S) <b>repel</b> — the field lines bend away from each other.":"<b>Opposite poles</b> facing (N–S) <b>attract</b> — the field lines join up between them."):"A bar magnet's <b>field lines</b> run from <b>North → South</b>. A compass needle lines up with the field. The three magnetic metals are <b>iron, nickel and cobalt</b>.";
  mgLoop();
}
function mgPoles(){
  const cy=160,hw=50,W=560,poles=[],mags=[];
  if(!MG.second){const mx=W/2,nLeft=!MG.flip;poles.push({x:mx-hw,y:cy,q:nLeft?1:-1});poles.push({x:mx+hw,y:cy,q:nLeft?-1:1});mags.push({x:mx,hw,nLeft});}
  else{const mx1=W/2-118,mx2=W/2+118,n1=!MG.flip;
    poles.push({x:mx1-hw,y:cy,q:n1?1:-1});poles.push({x:mx1+hw,y:cy,q:n1?-1:1});mags.push({x:mx1,hw,nLeft:n1});
    const rightSign=n1?-1:1;const m2Left=MG.repel?rightSign:-rightSign;
    poles.push({x:mx2-hw,y:cy,q:m2Left});poles.push({x:mx2+hw,y:cy,q:-m2Left});mags.push({x:mx2,hw,nLeft:m2Left>0});}
  return {poles,mags,cy,hw};
}
function mgField(px,py,poles){let fx=0,fy=0;for(const p of poles){const dx=px-p.x,dy=py-p.y;let r2=dx*dx+dy*dy;if(r2<80)r2=80;const r=Math.sqrt(r2);const f=p.q/(r2*r);fx+=f*dx;fy+=f*dy;}return [fx,fy];}
function mgLoop(){
  if(!MG)return;const {ctx,cv}=MG,W=cv.width,H=cv.height;MG.t++;
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#0a1424';ctx.fillRect(0,0,W,H);
  const {poles,mags,cy,hw}=mgPoles();
  // field visualisation
  if(MG.filings){ctx.strokeStyle='rgba(150,180,220,.5)';ctx.lineWidth=2;
    for(let x=18;x<W;x+=22)for(let y=18;y<H;y+=22){const [fx,fy]=mgField(x,y,poles);const a=Math.atan2(fy,fx);const L=7;ctx.beginPath();ctx.moveTo(x-Math.cos(a)*L,y-Math.sin(a)*L);ctx.lineTo(x+Math.cos(a)*L,y+Math.sin(a)*L);ctx.stroke();}}
  else{for(let x=60;x<W;x+=72)for(let y=44;y<H;y+=68){const [fx,fy]=mgField(x,y,poles);const a=Math.atan2(fy,fx);
    ctx.strokeStyle='rgba(120,150,190,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,13,0,6.28);ctx.stroke();
    ctx.strokeStyle='#ff4d6d';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*11,y+Math.sin(a)*11);ctx.stroke();
    ctx.strokeStyle='#dfe9ff';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-Math.cos(a)*11,y-Math.sin(a)*11);ctx.stroke();}}
  // draw magnets
  mags.forEach(m=>{const x=m.x,w=m.hw;
    ctx.fillStyle=m.nLeft?'#e8413f':'#3a6bd6';ctx.fillRect(x-w-8,cy-20,w+8,40);
    ctx.fillStyle=m.nLeft?'#3a6bd6':'#e8413f';ctx.fillRect(x,cy-20,w+8,40);
    ctx.strokeStyle='#0a1424';ctx.lineWidth=2;ctx.strokeRect(x-w-8,cy-20,(w+8)*2,40);
    ctx.fillStyle='#fff';ctx.font='bold 18px Trebuchet MS';ctx.textAlign='center';
    ctx.fillText(m.nLeft?'N':'S',x-w/2-4,cy+6);ctx.fillText(m.nLeft?'S':'N',x+w/2+4,cy+6);ctx.textAlign='start';});
  raf=requestAnimationFrame(mgLoop);
}

/* ===================== STATION 10 — GENETICS LAB ===================== */
let GN;
function genetics(){stopLoop();GN={dad:'Bb',mum:'Bb'};drawGN();}
function gnRatio(a,b){if(b===0)return a+':0';if(a===0)return'0:'+b;const g=(x,y)=>y?g(y,x%y):x;const k=g(a,b);return (a/k)+':'+(b/k);}
function drawGN(){
  const opts=['BB','Bb','bb'];const d=GN.dad.split(''),m=GN.mum.split('');
  const cells=[[ [d[0],m[0]].sort().join(''),[d[1],m[0]].sort().join('') ],[ [d[0],m[1]].sort().join(''),[d[1],m[1]].sort().join('') ]];
  const flat=[cells[0][0],cells[0][1],cells[1][0],cells[1][1]];
  const brown=flat.filter(g=>g.includes('B')).length,blue=4-brown;
  const sel=(who,v)=>`<button class="tool" style="${GN[who]===v?'border-color:var(--acid);color:var(--acid)':''}" onclick="GN.${who}='${v}';SFX.click();drawGN()">${v}</button>`;
  let grid=`<table style="margin:12px auto;border-collapse:separate;border-spacing:6px;font-weight:bold"><tr><td></td><td style="color:#8fb3d9">${d[0]}</td><td style="color:#8fb3d9">${d[1]}</td></tr>`;
  for(let r=0;r<2;r++){grid+=`<tr><td style="color:#8fb3d9">${m[r]}</td>`;for(let c=0;c<2;c++){const g=cells[r][c];const bg=g.includes('B')?'#6a4a2b':'#2a5b8a';grid+=`<td style="padding:16px 20px;background:${bg};border-radius:10px;font-size:18px;color:#fff">${g}</td>`}grid+=`</tr>`}
  grid+=`</table>`;
  root.innerHTML=`<div class="topbar"><span class="tag">🧬 Genetics Lab</span><button class="muteBtn" id="muteBtn" onclick="toggleMute()">${muted?'🔇':'🔊'}</button></div>
   <h2 class="center">Punnett Square — eye colour</h2>
   <div class="small center">B = brown (dominant) • b = blue (recessive)</div>
   <div class="center" style="margin-top:8px;color:#cfe0f5"><b>Father:</b> ${opts.map(o=>sel('dad',o)).join('')}</div>
   <div class="center" style="color:#cfe0f5"><b>Mother:</b> ${opts.map(o=>sel('mum',o)).join('')}</div>
   ${grid}
   <div class="info center"><b>🟤 ${brown}/4 brown-eyed</b> &nbsp;&nbsp; <b>🔵 ${blue}/4 blue-eyed</b><br>Ratio (brown : blue) = <b>${gnRatio(brown,blue)}</b>.${(blue>0&&d.includes('B')&&m.includes('B'))?' Two brown-eyed carriers can still have a blue-eyed child! 👀':''}</div>
   <div class="info" style="margin-top:8px"><b>🧬 Genetic modification:</b> scientists can deliberately alter an organism's genes — e.g. crops engineered for higher yields or to make their own insecticide, or bacteria altered to produce medicines like insulin.</div>
   <button class="btn ghost" onclick="SFX.click();hub()">⬅️ Back to lab</button>`;
}

/* boot */
hub();
</script>
