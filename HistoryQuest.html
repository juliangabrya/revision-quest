<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔️ HISTORYQUEST: Year 8 Boss Battles 🏰</title>
<style>
  :root{
    --bg:#0d0a1c; --card:#1b1530; --accent:#ffd23f; --accent2:#ff4d6d;
    --good:#3ddc84; --bad:#ff4d6d; --blue:#4d96ff; --purple:#9b5de5; --ink:#f5f3ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    background:radial-gradient(1200px 800px at 70% -10%, #2a1d4e 0%, var(--bg) 55%);
    color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:16px;overflow-x:hidden;
  }
  .wrap{width:100%;max-width:760px}
  .panel{
    background:linear-gradient(180deg,#221a3d,#1b1530);
    border:3px solid #3a2d63;border-radius:22px;padding:24px;
    box-shadow:0 24px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
  }
  h1{font-size:30px;line-height:1.1;text-align:center;margin-bottom:6px;
    text-shadow:0 3px 0 #000, 0 0 24px rgba(255,210,63,.35)}
  h2{font-size:23px;margin-bottom:10px;color:var(--accent)}
  .sub{text-align:center;color:#b7aee0;margin-bottom:16px;font-size:15px}
  .btn{
    margin-top:14px;width:100%;padding:15px;border:none;border-radius:14px;cursor:pointer;
    font-size:18px;font-weight:bold;font-family:inherit;
    background:linear-gradient(180deg,var(--accent),#f0b800);color:#2a1d00;
    box-shadow:0 6px 0 #b98a00, 0 10px 18px rgba(0,0,0,.4);transition:transform .06s;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b98a00}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:#241c42;color:var(--ink);box-shadow:0 6px 0 #15102a}
  .btn.danger{background:linear-gradient(180deg,var(--accent2),#d62f4d);color:#fff;box-shadow:0 6px 0 #8c1226}
  .btn.row{margin-top:0}
  .btnrow{display:flex;gap:12px;margin-top:14px}

  /* MAP */
  .map{display:grid;gap:14px;margin-top:8px}
  .node{
    display:flex;align-items:center;gap:16px;padding:16px;border-radius:18px;
    border:3px solid #3a2d63;background:#241c42;cursor:pointer;transition:transform .1s, border-color .15s;
    position:relative;overflow:hidden;
  }
  .node:hover:not(.locked){transform:translateX(6px);border-color:var(--accent)}
  .node .ico{font-size:42px;width:56px;text-align:center;flex:none}
  .node .meta{flex:1}
  .node .meta b{font-size:19px;display:block}
  .node .meta span{font-size:13px;color:#b7aee0}
  .node .status{font-size:24px;flex:none}
  .node.locked{opacity:.5;cursor:not-allowed;filter:grayscale(.6)}
  .node.done{border-color:var(--good)}
  .node.done::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(61,220,132,.12),transparent)}

  /* LESSON */
  .slide{min-height:120px}
  .meme{
    margin:16px 0;border-radius:16px;overflow:hidden;border:3px solid #000;
    background:#000;box-shadow:0 14px 30px rgba(0,0,0,.5)
  }
  .meme .img{padding:26px 18px;text-align:center;font-size:60px;
    background:linear-gradient(135deg,#3a2d63,#1b1530)}
  .meme .cap{font-family:Impact,'Arial Black',sans-serif;text-transform:uppercase;
    color:#fff;-webkit-text-stroke:1.6px #000;letter-spacing:.02em;
    font-size:21px;line-height:1.15;padding:10px 14px;background:#000;text-align:center}
  .lessonbody{font-size:16px;line-height:1.55;color:#e7e2fb}
  .lessonbody b{color:var(--accent)}
  .lessonbody .hook{display:block;margin-top:12px;padding:11px 14px;background:#150f29;
    border-left:5px solid var(--blue);border-radius:10px;color:#cfe3ff;font-size:15px}
  .lessonbody ul{margin:8px 0 4px 20px}
  .lessonbody li{margin:6px 0}
  .dots{display:flex;gap:7px;justify-content:center;margin:14px 0 2px}
  .dots i{width:9px;height:9px;border-radius:50%;background:#3a2d63;transition:background .2s}
  .dots i.on{background:var(--accent)}

  /* BATTLE */
  .arena{margin-top:6px}
  .fighter{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .fighter .face{font-size:46px;flex:none;width:60px;text-align:center}
  .fighter .bars{flex:1}
  .fighter .nm{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
  .hpbar{height:18px;background:#150f29;border-radius:10px;overflow:hidden;border:2px solid #36285e}
  .hpbar > i{display:block;height:100%;transition:width .5s}
  .hp-enemy > i{background:linear-gradient(90deg,#d62f4d,#ff7d99)}
  .hp-self > i{background:linear-gradient(90deg,#2cb96a,#5dffa0)}
  .bubble{background:#150f29;border:2px solid #36285e;border-radius:14px;padding:11px 14px;
    font-size:14px;color:#dcd6f5;margin:10px 0;min-height:42px;font-style:italic}
  .cat{display:inline-block;font-size:12px;font-weight:bold;padding:5px 12px;border-radius:999px;
    background:var(--purple);color:#fff;margin-bottom:10px;letter-spacing:.04em}
  .q{font-size:20px;font-weight:bold;line-height:1.35;margin-bottom:14px}
  .opts{display:grid;gap:10px}
  .opt{text-align:left;padding:13px 15px;border-radius:13px;border:2px solid #3a2d63;
    background:#241c42;color:var(--ink);font-size:16px;cursor:pointer;transition:transform .08s, background .15s;font-family:inherit}
  .opt:hover{background:#2e2454;transform:translateY(-2px)}
  .opt.correct{background:var(--good);color:#04210f;border-color:#2cb96a;font-weight:bold}
  .opt.wrong{background:var(--bad);color:#2a000a;border-color:#d62f4d;font-weight:bold}
  .opt.dim{opacity:.4}
  .opt:disabled{cursor:default}
  .explain{margin-top:14px;background:#150f29;border-left:5px solid var(--accent);
    border-radius:10px;padding:13px 15px;font-size:15px;line-height:1.5;color:#dcd6f5;display:none}
  .explain b{color:var(--accent)}

  .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);
    background:#000;border:2px solid var(--accent);color:var(--accent);
    padding:10px 20px;border-radius:999px;font-weight:bold;font-size:16px;opacity:0;
    transition:opacity .25s, top .25s;pointer-events:none;z-index:50;text-align:center}
  .toast.show{opacity:1;top:28px}
  .hud{display:flex;gap:10px;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
  .stat{flex:1;min-width:80px;background:#150f29;border:2px solid #36285e;border-radius:14px;padding:8px;text-align:center}
  .stat b{display:block;font-size:20px}
  .stat span{font-size:10px;color:#9d93c9;text-transform:uppercase;letter-spacing:.06em}
  .streak.fire b{color:var(--accent);text-shadow:0 0 12px var(--accent)}
  .center{text-align:center}
  .pulse{animation:pulse .45s}
  @keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  .float{position:fixed;font-family:Impact,sans-serif;font-size:40px;color:var(--accent);
    -webkit-text-stroke:2px #000;pointer-events:none;z-index:60;opacity:0}
  .report-row{display:flex;align-items:center;gap:12px;margin:9px 0}
  .report-row .name{width:140px;font-weight:bold;font-size:14px}
  .report-row .track{flex:1;height:15px;background:#150f29;border-radius:8px;overflow:hidden;border:2px solid #36285e}
  .report-row .track > i{display:block;height:100%}
  .report-row .pct{width:46px;text-align:right;font-weight:bold;font-size:14px}
  .muteBtn{position:fixed;top:14px;right:16px;background:#241c42;border:2px solid #3a2d63;
    color:var(--ink);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:14px;z-index:40}
</style>
</head>
<body>
<button class="muteBtn" id="muteBtn" onclick="toggleMute()">🔊</button>
<div class="toast" id="toast"></div>
<div class="wrap"><div class="panel" id="panel"></div></div>

// sound (WebAudio beeps, no files needed)
let actx;
function beep(freq,dur,type){
  if(muted)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'square';o.frequency.value=freq;
    o.connect(g);g.connect(actx.destination);
    g.gain.setValueAtTime(.12,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+dur);
    o.start();o.stop(actx.currentTime+dur);
  }catch(e){}
}
const sfx={
  good:()=>{beep(660,.08);setTimeout(()=>beep(880,.12),80)},
  crit:()=>{beep(660,.07);setTimeout(()=>beep(990,.07),70);setTimeout(()=>beep(1320,.16),140)},
  bad:()=>{beep(180,.18,'sawtooth')},
  win:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16),i*120))},
  click:()=>beep(420,.04),
};
function toggleMute(){muted=!muted;document.getElementById('muteBtn').textContent=muted?'🔇':'🔊'}

function showToast(t,ms){toast.innerHTML=t;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),ms||1200)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function floatText(txt,color){
  const el=document.createElement('div');el.className='float';el.textContent=txt;
  if(color)el.style.color=color;
  el.style.left=(40+Math.random()*30)+'%';el.style.top='42%';
  document.body.appendChild(el);
  el.animate([{opacity:1,transform:'translateY(0) scale(1)'},{opacity:0,transform:'translateY(-90px) scale(1.4)'}],{duration:900,easing:'ease-out'});
  setTimeout(()=>el.remove(),900);
}

/* ---------- BATTLE ---------- */
let B; // battle state
function battle(si){
  const s=STAGES[si];
  const qs=shuffle([...s.questions]);
  B={si,s,qs,i:0,score:0,streak:0,best:0,
     bossMax:qs.length, bossHP:qs.length,   // 1 hp per question
     playerHP:5, answered:false,
     stat:{cat:s.questions[0].cat, correct:0, total:0}};
  drawBattle();
}
function drawBattle(){
  if(B.bossHP<=0){return winStage()}
  if(B.playerHP<=0){return faint()}
  B.answered=false;
  const s=B.s;const q=B.qs[B.i];
  const taunt=s.boss.taunts[B.i%s.boss.taunts.length];
  const bossPct=Math.max(0,(B.bossHP/B.bossMax)*100);
  const selfPct=(B.playerHP/5)*100;
  panel.innerHTML=`
    <div class="arena">
      <div class="fighter">
        <div class="face" id="bossface">${s.boss.emoji}</div>
        <div class="bars"><div class="nm"><b>${s.boss.name}</b><span>${B.bossHP}/${B.bossMax} HP</span></div>
          <div class="hpbar hp-enemy"><i style="width:${bossPct}%"></i></div></div>
      </div>

        <div class="face" id="selfface">🧑‍🎓</div>

          <div class="hpbar hp-self"><i style="width:${selfPct}%"></i></div></div>
      </div>
    </div>
    <div class="hud">
      <div class="stat"><b>${B.score}</b><span>Score</span></div>
      <div class="stat streak ${B.streak>=2?'fire':''}"><b>${B.streak}${B.streak>=2?'🔥':''}</b><span>Combo</span></div>
      <div class="stat"><b>${B.i+1}/${B.qs.length}</b><span>Hit</span></div>
    </div>
    <span class="cat">${q.cat}</span>
    <div class="q">${q.q}</div>
    <div class="opts" id="opts"></div>
    <div class="meme" id="meme" style="display:none"><div class="img" id="memeimg"></div><div class="cap" id="memecap"></div></div>
    <div class="explain" id="explain"></div>
    <button class="btn" id="next" style="display:none" onclick="sfx.click();nextHit()">NEXT HIT ➡️</button>
  `;
  const optsEl=document.getElementById('opts');
  shuffle(q.opts.map((t,k)=>({t,k}))).forEach(o=>{
    const b=document.createElement('button');b.className='opt';b.textContent=o.t;
    b.onclick=()=>answer(b,o.k===q.a,q);
    optsEl.appendChild(b);
  });
}
function answer(btn,correct,q){
  if(B.answered)return;B.answered=true;
  B.stat.total++;
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;
    if(b.textContent===q.opts[q.a])b.classList.add('correct');else b.classList.add('dim');});
  const meme=document.getElementById('meme');
  document.getElementById('memeimg').textContent=q.meme[0];
  document.getElementById('memecap').innerHTML=q.meme[1]+"<br>"+q.meme[2];
  const explain=document.getElementById('explain');
  explain.innerHTML=(correct?"✅ <b>HIT!</b> ":"❌ <b>The answer:</b> ")+q.why;
  explain.style.display='block';

  if(correct){
    B.stat.correct++;B.streak++;B.best=Math.max(B.best,B.streak);
    const crit=B.streak>=3;
    const dmg=crit?2:1;
    B.bossHP=Math.max(0,B.bossHP-dmg);
    B.score+=100+ (B.streak-1)*25;
    meme.style.display='block';meme.classList.add('pulse');
    const bf=document.getElementById('bossface');bf.classList.add('shake');
    if(crit){sfx.crit();floatText("CRIT! x"+B.streak,'#ffd23f');showToast("💥 CRITICAL HIT! Combo x"+B.streak)}
    else{sfx.good();floatText("HIT!",'#3ddc84');showToast("✅ Nice! +"+(100+(B.streak-1)*25))}
  }else{
    B.streak=0;B.playerHP--;
    btn.classList.remove('dim');btn.classList.add('wrong');
    meme.style.display='block';
    const sf=document.getElementById('selfface');sf.textContent='🤕';
    panel.classList.add('shake');setTimeout(()=>panel.classList.remove('shake'),420);
    sfx.bad();floatText("-1 ❤️",'#ff4d6d');showToast("💢 The boss strikes back! Read the answer 👇");
  }
  // update bars live
  document.querySelector('.hp-enemy > i').style.width=Math.max(0,(B.bossHP/B.bossMax)*100)+'%';
  document.querySelector('.hp-self > i').style.width=(B.playerHP/5)*100+'%';
  document.getElementById('next').style.display='block';
  document.getElementById('next').textContent = (B.bossHP<=0)?'🏆 FINISH HIM!' : (B.playerHP<=0)?'💀 Continue':'NEXT HIT ➡️';
}
function nextHit(){
  if(B.bossHP<=0)return winStage();
  if(B.playerHP<=0)return faint();
  B.i++;
  if(B.i>=B.qs.length){
    // ran out of questions but boss alive (shouldn't happen, hp==numQ) -> loop unanswered
    if(B.bossHP>0){B.qs=shuffle([...B.s.questions]);B.i=0;}
  }
  drawBattle();
}
function faint(){
  sfx.bad();
  const s=B.s;
  panel.innerHTML=`

    <div class="meme"><div class="img">🤕💫</div><div class="cap">DOWN BUT NOT OUT<br>REVIEW & RETRY</div></div>

function winStage(){
  sfx.win();
  const s=B.s;
  if(!done.includes(s.id)){done.push(s.id);saveDone(done)}
  // save best stats per category
  const allStats=loadStats();

  // keep the better accuracy run
  const newAcc=B.stat.total?B.stat.correct/B.stat.total:0;
  const oldAcc=prev.total?prev.correct/prev.total:-1;
  if(newAcc>=oldAcc)allStats[B.stat.cat]={correct:B.stat.correct,total:B.stat.total};
  saveStats(allStats);

  const acc=Math.round((B.stat.correct/B.stat.total)*100);
  const nextI=B.si+1;

    </p>
    ${hasNext?`<button class="btn" onclick="sfx.click();stageIntro(${nextI})">➡️ Next: ${STAGES[nextI].name}</button>`

    <button class="btn ghost" onclick="sfx.click();battle(${B.si})">🔁 Replay this boss</button>
    <button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>
  `;
}

/* ---------- GAP REPORT ---------- */
function report(){
  const allStats=loadStats();
  const cats=["Key Terms","Medieval Church","Civil War","Abolition","Ottomans","British Empire","Industrial Revolution"];
  let rows='';const ranked=[];
  cats.forEach(c=>{
    const st=allStats[c];if(!st||!st.total)return;
    ranked.push({c,p:Math.round((st.correct/st.total)*100)});
  });
  ranked.sort((a,b)=>a.p-b.p);
  ranked.forEach(r=>{
    const col=r.p>=80?'var(--good)':r.p>=50?'var(--accent)':'var(--bad)';
    rows+=`<div class="report-row"><div class="name">${r.c}</div>
      <div class="track"><i style="width:${r.p}%;background:${col}"></i></div>
      <div class="pct" style="color:${col}">${r.p}%</div></div>`;
  });
  const avg=ranked.length?Math.round(ranked.reduce((s,r)=>s+r.p,0)/ranked.length):0;
  let verdict,vmeme;
  if(avg>=85){verdict="🏆 EXAM SLAYER. You're basically the teacher now.";vmeme=["🧠✨","CERTIFIED","HISTORY GENIUS"];}
  else if(avg>=65){verdict="💪 Strong! Patch the red bars and you're golden.";vmeme=["📈🔥","ALMOST THERE","PATCH THE GAPS"];}
  else{verdict="📚 Good effort — focus your revision on the red bars below.";vmeme=["🛠️📖","WORK IN PROGRESS","WE CAN FIX THIS"];}
  const tips={
    "Key Terms":"Flashcards: provenance (who/when/why), decolonisation, golden age, source, economy, industrial revolution.",
    "Medieval Church":"Chain it: Crusades (S-U-H) → Magna Carta (1215, King John forced by barons, limits king). Richard=Crusader hero, John=excommunicated.",
    "Civil War":"Causes = R-M-P (Religion, Money, Power). Timeline: 1629 close Parliament → Jan 1642 storm Commons → 22 Aug 1642 war → 1649 execution → 1653 Lord Protector → 1660 Restoration.",
    "Abolition":"The team: Wilberforce (MP/speeches), Clarkson (evidence/Society 1787/Zong), Equiano (autobiography/Sons of Africa), women (sugar boycotts), revolts (Haiti 1791, Jamaica 1831). Act = 1807.",
    "Ottomans":"1453 Mehmed II takes Constantinople (→ Istanbul). Lasted 622 yrs: army (Janissaries), all-powerful Sultan, geography, millets (religious tolerance), economy. Suleiman the Magnificent.",
    "British Empire":"Why = P-E-S-M-R (Political/Economic/Social/Military/Religious). India: 1757 Plassey → 1857 Mutiny → British Raj → 1947 independence. Scramble for Africa (90% by 1914). Fell: WWII/Cold War, nationalism, bankruptcy.",
    "Industrial Revolution":"= sudden change in industry. Causes: agriculture, inventions, empire/slavery, iron/coal/cotton. Child labour (~age 10). Disease: typhus/cholera. Reforms: 1833 Factory Act, 1834 workhouses, 1870 education."
  };
  const weak=ranked.filter(r=>r.p<70);
  const gapHtml = weak.length
    ? `<div class="gaps" style="background:#150f29;border-radius:14px;padding:16px;margin-top:14px;border:2px solid #36285e">
        <h3 style="color:var(--accent2);margin-bottom:8px">🎯 Patch these gaps:</h3>
        <ul style="margin-left:18px">${weak.map(w=>`<li style="margin:7px 0;color:#dcd6f5;line-height:1.45"><b style="color:var(--accent)">${w.c}</b> (${w.p}%): ${tips[w.c]}</li>`).join('')}</ul></div>`
    : `<div class="gaps" style="background:#150f29;border-radius:14px;padding:16px;margin-top:14px;border:2px solid #36285e">
        <h3 style="color:var(--good)">🎉 No major gaps — every topic ≥70%!</h3>
        <p style="color:#dcd6f5;margin-top:6px">Replay any boss for a perfect run, then go flex on that exam.</p></div>`;
  panel.innerHTML=`
    <h1>🏁 GAP REPORT</h1>
    <div class="meme"><div class="img">${vmeme[0]}</div><div class="cap">${vmeme[1]}<br>${vmeme[2]}</div></div>
    <div class="verdict" style="font-size:19px;text-align:center;margin:14px 0;line-height:1.4">${verdict}</div>
    <h3 style="color:var(--accent);margin:6px 0">Topic breakdown (weakest first):</h3>
    ${rows||'<p style="color:#b7aee0">Beat some bosses first to see your stats!</p>'}

/* ---------- FINAL EXAM (all topics) ---------- */
let FE;
function finalExam(){
  const all=[];STAGES.forEach(s=>s.questions.forEach(q=>all.push(q)));
  shuffle(all);
  const N=Math.min(25,all.length);
  FE={qs:all.slice(0,N),i:0,correct:0,stat:{},answered:false};
  feRender();
}
function feRender(){
  if(FE.i>=FE.qs.length)return feResult();
  FE.answered=false;
  const q=FE.qs[FE.i];const prog=Math.round(FE.i/FE.qs.length*100);
  panel.innerHTML=`
    <span class="cat" style="background:var(--accent2)">🎓 FINAL EXAM</span>
    <div class="hud">
      <div class="stat"><b>${FE.i+1}/${FE.qs.length}</b><span>Question</span></div>
      <div class="stat"><b>${FE.correct}</b><span>Correct</span></div>
      <div class="stat"><b>${FE.i?Math.round(FE.correct/FE.i*100):0}%</b><span>Running</span></div>
    </div>
    <div class="bar"><i style="width:${prog}%"></i></div>
    <span class="cat">${q.cat}</span>
    <div class="q">${q.q}</div>
    <div class="opts" id="opts"></div>
    <div class="explain" id="explain"></div>
    <button class="btn" id="next" style="display:none" onclick="sfx.click();feNext()">NEXT ➡️</button>
  `;
  const optsEl=document.getElementById('opts');
  shuffle(q.opts.map((t,k)=>({t,k}))).forEach(o=>{
    const b=document.createElement('button');b.className='opt';b.textContent=o.t;
    b.onclick=()=>feChoose(b,o.k===q.a,q);optsEl.appendChild(b);
  });
}
function feChoose(btn,correct,q){
  if(FE.answered)return;FE.answered=true;
  FE.stat[q.cat]=FE.stat[q.cat]||{correct:0,total:0};FE.stat[q.cat].total++;
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;
    if(b.textContent===q.opts[q.a])b.classList.add('correct');else b.classList.add('dim');});
  const ex=document.getElementById('explain');
  ex.innerHTML=(correct?"✅ <b>Correct!</b> ":"❌ <b>Answer:</b> ")+q.why;ex.style.display='block';
  if(correct){FE.correct++;FE.stat[q.cat].correct++;showToast("✅ Correct");}
  else{btn.classList.remove('dim');btn.classList.add('wrong');showToast("❌");}
  const n=document.getElementById('next');n.style.display='block';
  if(FE.i>=FE.qs.length-1)n.textContent='🏁 FINISH EXAM';
}
function feNext(){FE.i++;feRender();}
function feResult(){
  const allStats=loadStats();
  for(const c in FE.stat){const prev=allStats[c]||{correct:0,total:0};
    const nA=FE.stat[c].correct/FE.stat[c].total, oA=prev.total?prev.correct/prev.total:-1;
    if(nA>=oA)allStats[c]=FE.stat[c];}
  saveStats(allStats);
  const pct=Math.round(FE.correct/FE.qs.length*100);
  let grade,gmeme;
  if(pct>=90){grade="Grade 9 🏆";gmeme=["🧠✨","TOP MARKS","HISTORY LEGEND"];}
  else if(pct>=80){grade="Grade 8";gmeme=["📈🔥","EXCELLENT","SO CLOSE TO PERFECT"];}
  else if(pct>=70){grade="Grade 7";gmeme=["💪","STRONG PASS","KEEP PUSHING"];}
  else if(pct>=55){grade="Grade 5–6";gmeme=["👍","SOLID PASS","PATCH THE GAPS"];}
  else if(pct>=40){grade="Grade 4";gmeme=["🛠️","SCRAPED A PASS","REVISE MORE"];}
  else {grade="Below pass";gmeme=["📚","NOT YET","BACK TO THE ORGANISERS"];}
  const ranked=Object.keys(FE.stat).map(c=>({c,p:Math.round(FE.stat[c].correct/FE.stat[c].total*100)})).sort((a,b)=>a.p-b.p);
  const rows=ranked.map(r=>{const col=r.p>=80?'var(--good)':r.p>=50?'var(--accent)':'var(--bad)';
    return `<div class="report-row"><div class="name">${r.c}</div><div class="track"><i style="width:${r.p}%;background:${col}"></i></div><div class="pct" style="color:${col}">${r.p}%</div></div>`;}).join('');
  const weak=ranked.filter(r=>r.p<70).map(r=>r.c);
  panel.innerHTML=`
    <h1>🎓 FINAL EXAM RESULT</h1>
    <div class="meme"><div class="img">${gmeme[0]}</div><div class="cap">${gmeme[1]}<br>${gmeme[2]}</div></div>
    <div class="hud">
      <div class="stat"><b>${FE.correct}/${FE.qs.length}</b><span>Score</span></div>
      <div class="stat"><b>${pct}%</b><span>Percent</span></div>
      <div class="stat"><b>${grade}</b><span>Grade</span></div></div>
    <h3 style="color:var(--accent);margin:8px 0 4px">By topic (weakest first):</h3>
    ${rows}
    ${weak.length?`<div class="gaps" style="background:#150f29;border-radius:14px;padding:14px;margin-top:12px;border:2px solid #36285e"><h3 style="color:var(--accent2)">🎯 Revise these first:</h3><p style="color:#dcd6f5;margin-top:6px">${weak.join(', ')} — then retake the exam!</p></div>`:`<div class="gaps" style="background:#150f29;border-radius:14px;padding:14px;margin-top:12px;border:2px solid #36285e"><h3 style="color:var(--good)">🎉 Every topic ≥70% — you're exam-ready!</h3></div>`}
    <button class="btn" onclick="sfx.click();finalExam()">🔁 Retake exam</button>
    <button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>
  `;
}

/* ---------- WRITTEN (mark-scheme) QUESTIONS ---------- */
const WRITTEN_H={

  {m:3,q:"Explain why King John had a poor relationship with the Church.",s:["He quarrelled with Pope Innocent III over the Archbishop of Canterbury","England was placed under an Interdict (churches closed)","John was excommunicated — cut off from the Church"]},
 ],

  {m:3,q:"Explain how the Civil War led to England becoming a republic.",s:["Parliament's New Model Army (Cromwell) defeated the Royalists","Charles I was put on trial and executed in 1649","With no monarch, England became a republic (Cromwell later became Lord Protector)"]},
 ],
 "Abolition":[

  {m:3,q:"Explain why the Abolition Act was passed in 1807.",s:["Religious & moral ideas (Quakers, Evangelical Christians) turned opinion against slavery","Campaigners — Clarkson, Wilberforce, Equiano — plus public pressure like the sugar boycotts","Slave revolts (Haiti 1791, Jamaica 1831) made slavery costly and harder to control"]},
 ],
 "Ottomans":[
  {m:1,q:"Who conquered Constantinople in 1453?",s:["Sultan Mehmed II ('the Conqueror')"]},
  {m:3,q:"Explain why the Ottoman Empire lasted for over 600 years.",s:["A powerful, skilled military (the Janissaries)","The Sultan's total control + good geography (Constantinople controlled trade)","Tolerance of different religions (millets) and a strong economy"]},
 ],
 "British Empire":[

  {m:3,q:"Explain why the British Empire fell.",s:["External pressure — after WWII, the Atlantic Charter and US/Cold-War opposition to empire","Nationalism — leaders like Gandhi; colonial soldiers expected freedom after fighting in WWII","Economic problems — Britain was bankrupt after WWII and couldn't afford the empire"]},
 ],
 "Industrial Revolution":[
  {m:2,q:"Describe two ways the Industrial Revolution was NOT 'freeing' for the working class.",s:["Child labour — children (avg age ~10) worked in dangerous mines, mills and as chimney sweeps","Overcrowded, unsanitary slums spread disease (typhus, cholera); harsh workhouses (1834 New Poor Law)"]},
  {m:3,q:"Explain the causes of the Industrial Revolution.",s:["The Agricultural Revolution gave more food → a bigger population and workers moving to cities","New inventions (e.g. the Spinning Jenny) made production more efficient and profitable","Empire & slavery supplied cheap raw materials (cotton), plus plentiful iron and coal"]},
 ],
};
let HW;
function histWritten(){
  let t='';Object.keys(WRITTEN_H).forEach(k=>{t+=`<div class="node" onclick="sfx.click();hwStart('${k}')"><div class="ico">📝</div><div class="meta"><b>${k}</b><span>${WRITTEN_H[k].length} questions</span></div><div class="status">▶️</div></div>`;});
  panel.innerHTML=`<h1>📝 Written Questions</h1><div class="sub">1, 2 & 3-mark exam-style questions. Answer in your head (or on paper), reveal the mark scheme, then mark yourself.</div><div class="map">${t}</div><button class="btn ghost" onclick="sfx.click();map()">🗺️ Back to map</button>`;
}
function hwStart(k){HW={k,list:WRITTEN_H[k],i:0,marks:0,max:WRITTEN_H[k].reduce((a,q)=>a+q.m,0)};hwQ();}
function hwQ(){
  if(HW.i>=HW.list.length)return hwResult();const q=HW.list[HW.i];
  panel.innerHTML=`<span class="cat">📝 ${HW.k} • ${HW.i+1}/${HW.list.length}</span>
   <div class="hud"><div class="stat"><b>${HW.marks}</b><span>Marks</span></div><div class="stat"><b>${q.m}</b><span>This Q</span></div></div>
   <div class="q">[${q.m} mark${q.m>1?'s':''}] ${q.q}</div>
   <textarea rows="4" placeholder="Write your answer (optional)..." style="width:100%;padding:12px;border-radius:12px;border:2px solid #3a2d63;background:#150f29;color:#f5f3ff;font-size:15px;font-family:inherit"></textarea>
   <button class="btn" id="rev" onclick="hwReveal()">👀 Reveal mark scheme</button>
   <div class="explain" id="ms"></div><div id="mk"></div>
   <button class="btn ghost" onclick="sfx.click();histWritten()">⬅️ Topics</button>`;
}
function hwReveal(){const q=HW.list[HW.i];const ms=document.getElementById('ms');
  ms.innerHTML="<b>Mark scheme (1 mark per point):</b><ul style='margin:6px 0 0 18px'>"+q.s.map(p=>`<li style='margin:5px 0'>${p}</li>`).join('')+"</ul>";ms.style.display='block';document.getElementById('rev').style.display='none';sfx.click();
  let b='';for(let m=0;m<=q.m;m++)b+=`<button class="btn" style="display:inline-block;width:auto;padding:9px 16px;margin:4px" onclick="hwScore(${m})">${m}</button>`;
  document.getElementById('mk').innerHTML=`<div style="margin-top:10px;color:#b7aee0">How many marks did you get?</div><div>${b}</div>`;}
function hwScore(m){HW.marks+=m;sfx.good&&sfx.good();HW.i++;hwQ();}
function hwResult(){const pct=Math.round(HW.marks/HW.max*100);sfx.win&&sfx.win();
  panel.innerHTML=`<h1>📝 ${HW.marks}/${HW.max} marks</h1><div class="meme"><div class="img">${pct>=80?'🏆':pct>=50?'💪':'📚'}</div><div class="cap">${HW.k}<br>${pct}%</div></div>
   <p style="text-align:center;color:#cfc7f0;margin:14px 0">${pct>=80?'Exam-ready on this topic!':pct>=50?'Solid — tighten up the points you missed.':'Re-read the lesson and try again!'}</p>
   <button class="btn" onclick="sfx.click();hwStart('${HW.k}')">🔁 Retry topic</button>
   <button class="btn ghost" onclick="sfx.click();histWritten()">⬅️ Topics</button>`;}

title();
