const app=document.getElementById('app');const toastEl=document.getElementById('toast');
function toast(t){toastEl.innerHTML=t;toastEl.classList.add('show');clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.classList.remove('show'),1100);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function loadScores(){try{return JSON.parse(localStorage.getItem('sq_scores')||'{}')}catch(e){return{}}}
function saveScore(k,c,t){const s=loadScores();const p=Math.round(c/t*100);if(s[k]==null||p>=s[k])s[k]=p;localStorage.setItem('sq_scores',JSON.stringify(s));}
let muted=false;let actx;
function beep(f,d,t){if(muted)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=t||'square';o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.12,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.start();o.stop(actx.currentTime+d)}catch(e){}}
const sfx={good:()=>{beep(660,.08);setTimeout(()=>beep(880,.12),80)},crit:()=>{[660,990,1320].forEach((f,i)=>setTimeout(()=>beep(f,.1),i*70))},bad:()=>beep(180,.18,'sawtooth'),click:()=>beep(440,.04),win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16),i*110))};

/* ============================ ENGINE ============================ */
function home(){

/* ---- quiz battle (shared) ---- */
let B;
function quizSub(k){const o=SUBJECTS[k];startBattle(o.name,o.emoji,o.boss,o.bem,o.taunts,o.cat,shuffle(o.qs.slice()));}
function quizLang(k){const o=LANG[k];startBattle(o.name,o.emoji,o.boss,o.bem,["Translate THIS!","¿Qué? You don't know!","Vocab fail incoming!"],o.cat,vocabQs(k,8));}
function startBattle(name,emoji,boss,bem,taunts,cat,qs){B={name,emoji,boss,bem,taunts,cat,qs,i:0,score:0,streak:0,best:0,correct:0,hp:5,bossMax:qs.length,bossHP:qs.length,answered:false};drawBattle();}
function drawBattle(){
  if(B.i>=B.qs.length)return battleWin();if(B.hp<=0)return battleFaint();B.answered=false;
  const q=B.qs[B.i],taunt=B.taunts[B.i%B.taunts.length];
  app.innerHTML=`<div class="topbar"><span class="tag">${B.emoji} ${B.name}</span></div>
   <div class="fighter"><div class="face">${B.bem}</div><div style="flex:1"><div class="nm"><b>${B.boss}</b><span>${B.bossHP}/${B.bossMax} HP</span></div><div class="hpbar hp-e"><i style="width:${B.bossHP/B.bossMax*100}%"></i></div></div></div>
   <div class="bubble">"${taunt}"</div>
   <div class="fighter"><div class="face">🧑‍🎓</div><div style="flex:1"><div class="nm"><b>You</b><span>${'❤️'.repeat(B.hp)}${'🖤'.repeat(5-B.hp)}</span></div><div class="hpbar hp-s"><i style="width:${B.hp/5*100}%"></i></div></div></div>
   <div class="hud"><div class="stat"><b>${B.score}</b><span>Score</span></div><div class="stat streak ${B.streak>=2?'fire':''}"><b>${B.streak}${B.streak>=2?'🔥':''}</b><span>Combo</span></div><div class="stat"><b>${B.i+1}/${B.qs.length}</b><span>Q</span></div></div>
   <div class="q">${q.q}</div><div class="opts" id="opts"></div><div class="explain" id="explain"></div>
   <button class="btn" id="next" style="display:none" onclick="sfx.click();bNext()">NEXT ➡️</button>`;
  const opts=document.getElementById('opts');
  q.o.map((t,k)=>({t,k})).sort(()=>Math.random()-0.5).forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o.t;b.onclick=()=>bAns(b,o.k===q.a,q);opts.appendChild(b);});
}
function bAns(btn,correct,q){
  if(B.answered)return;B.answered=true;
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===q.o[q.a])b.classList.add('correct');else b.classList.add('dim');});
  const ex=document.getElementById('explain');ex.innerHTML=(correct?"✅ <b>HIT!</b> ":"❌ <b>Answer:</b> ")+q.w;ex.style.display='block';
  if(correct){B.correct++;B.streak++;B.best=Math.max(B.best,B.streak);B.bossHP=Math.max(0,B.bossHP-1);B.score+=100+(B.streak-1)*25;
    if(B.streak>=3){sfx.crit();toast("💥 CRITICAL! x"+B.streak);}else{sfx.good();toast("✅ +"+(100+(B.streak-1)*25));}}
  else{B.streak=0;B.hp--;btn.classList.remove('dim');btn.classList.add('wrong');sfx.bad();toast("💢 Boss hits back!");}
  document.querySelector('.hp-e>i').style.width=Math.max(0,B.bossHP/B.bossMax*100)+'%';document.querySelector('.hp-s>i').style.width=B.hp/5*100+'%';
  const n=document.getElementById('next');n.style.display='block';n.textContent=B.i>=B.qs.length-1?'🏁 FINISH':'NEXT ➡️';
}
function bNext(){if(B.hp<=0)return battleFaint();B.i++;drawBattle();}
function battleFaint(){sfx.bad();app.innerHTML=`<h1>😵 Fainted!</h1><div class="center" style="font-size:56px">🤕</div><p class="center small" style="margin:14px 0">${B.boss} got 5 hits in — just a few gaps. Revise & retry!</p><button class="btn" onclick="sfx.click();drawBattleRetry()">🔁 Retry</button><button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>`;}
function drawBattleRetry(){B.i=0;B.score=0;B.streak=0;B.correct=0;B.hp=5;B.bossHP=B.bossMax;shuffle(B.qs);drawBattle();}
function battleWin(){sfx.win();saveScore(B.cat,B.correct,B.qs.length);const pct=Math.round(B.correct/B.qs.length*100);
  app.innerHTML=`<h1>🏆 ${B.boss} DEFEATED!</h1><div class="center" style="font-size:56px">${B.bem}💥</div>
   <div class="hud" style="margin-top:14px"><div class="stat"><b>${B.score}</b><span>Score</span></div><div class="stat"><b>${pct}%</b><span>Accuracy</span></div><div class="stat"><b>${B.best}🔥</b><span>Best combo</span></div></div>
   <p class="center small">${pct>=90?"🌟 Flawless!":pct>=70?"💪 Strong — one more for the perfect run!":"📚 Beaten — revise the misses & retry."}</p>
   <button class="btn green" onclick="sfx.click();map()">🗺️ Map</button><button class="btn ghost" onclick="sfx.click();drawBattleRetry()">🔁 Replay</button>`;}

/* ---- Maths Dojo ---- */
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
const DOJO=[
 {n:'Percentage of an amount',gen(){const p=[10,20,25,50][rnd(0,3)],y=rnd(2,9)*100;return{q:`Find ${p}% of ${y}.`,ans:y*p/100,work:`${y} ÷ 100 = ${y/100}; × ${p} = ${y*p/100}.`}}},
 {n:'Volume of a cuboid',gen(){const l=rnd(2,9),w=rnd(2,9),h=rnd(2,6);return{q:`Volume of a cuboid ${l} × ${w} × ${h} cm? (cm³)`,ans:l*w*h,work:`V = L×W×H = ${l}×${w}×${h} = ${l*w*h} cm³.`}}},
 {n:'Metric conversion (kg→g)',gen(){const k=rnd(2,9);return{q:`Convert ${k} kg into grams.`,ans:k*1000,work:`1 kg = 1000 g, so ${k} kg = ${k*1000} g.`}}},
 {n:'Increase by a percentage',gen(){const p=[10,20,50][rnd(0,2)],y=rnd(2,9)*100;return{q:`Increase ${y} by ${p}%.`,ans:y+y*p/100,work:`${p}% of ${y} = ${y*p/100}; ${y} + ${y*p/100} = ${y+y*p/100}.`}}},
 {n:'Density',gen(){const d=rnd(2,9),v=rnd(2,6);return{q:`Density = ${d} g/cm³, volume = ${v} cm³. Find the mass. (Mass = Density × Volume)`,ans:d*v,work:`Mass = D × V = ${d} × ${v} = ${d*v} g.`}}},
];
let DJ;
function dojo(){DJ={i:0,marks:0,total:8,answered:false};dojoQ();}
function dojoQ(){
  if(DJ.i>=DJ.total)return dojoResult();
  const F=DOJO[rnd(0,DOJO.length-1)];DJ.cur={F,item:F.gen()};DJ.answered=false;
  app.innerHTML=`<div class="topbar"><span class="tag">🥋 Maths Dojo ${DJ.i+1}/${DJ.total}</span></div>
   <div class="hud"><div class="stat"><b>${DJ.marks}</b><span>Marks</span></div><div class="stat"><b>${DJ.i+1}/${DJ.total}</b><span>Q</span></div></div>
   <div class="info"><b>${F.n}</b></div><div class="q" style="margin-top:8px">${DJ.cur.item.q}</div>
   <input type="text" id="din" inputmode="decimal" placeholder="Type your answer (number only)">
   <button class="btn" id="dsub" onclick="dojoCheck()">✅ Check</button>
   <div class="explain" id="dex"></div>
   <button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>`;
  const inp=document.getElementById('din');inp.focus();inp.addEventListener('keydown',e=>{if(e.key==='Enter')dojoCheck();});
}
function dojoCheck(){if(DJ.answered)return;const v=parseFloat(document.getElementById('din').value);const it=DJ.cur.item;const ok=!isNaN(v)&&Math.abs(v-it.ans)<0.01;DJ.answered=true;
  const ex=document.getElementById('dex');if(ok){DJ.marks++;sfx.good();ex.innerHTML="✅ <b>Correct!</b> "+it.work;}else{sfx.bad();ex.innerHTML="❌ <b>Answer: "+it.ans+"</b><br>"+it.work;}ex.style.display='block';
  const s=document.getElementById('dsub');s.textContent=DJ.i>=DJ.total-1?'🏁 Finish':'Next ➡️';s.onclick=()=>{DJ.i++;dojoQ();};}
function dojoResult(){const pct=Math.round(DJ.marks/DJ.total*100);sfx.win();saveScore('Maths',DJ.marks,DJ.total);
  app.innerHTML=`<h1>🥋 ${DJ.marks}/${DJ.total}</h1><div class="center" style="font-size:54px">${pct>=80?'🏆':pct>=50?'💪':'📚'}</div>
   <p class="center small">${pct>=80?'Maths master!':pct>=50?'Good — keep drilling!':'Practice makes perfect.'}</p>
   <button class="btn" onclick="sfx.click();dojo()">🔁 Again</button><button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>`;}

/* ---- Vocab Match ---- */
let VM;
function matchMenu(){app.innerHTML=`<div class="topbar"><span class="tag">🔤 Vocab Match</span></div><h2>Pick a language</h2>
  <div class="grid"><div class="tile" onclick="sfx.click();vocabMatch('french')"><div class="em">🇫🇷</div><b>French</b></div><div class="tile" onclick="sfx.click();vocabMatch('spanish')"><div class="em">🇪🇸</div><b>Spanish</b></div></div>
  <button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>`;}
function vocabMatch(key){const L=LANG[key];const pool=shuffle(L.pairs.slice()).slice(0,6);
  VM={key,pairs:pool,left:shuffle(pool.map(p=>p[0])),right:shuffle(pool.map(p=>p[1])),selL:null,selR:null,done:0,tries:0};drawVM();}
function drawVM(){const L=LANG[VM.key];
  const lcol=VM.left.map(w=>`<button class="mbtn" id="L_${btoa(unescape(encodeURIComponent(w))).replace(/=/g,'')}" onclick="vmPick('L','${encodeURIComponent(w)}')">${w}</button>`).join('');
  const rcol=VM.right.map(w=>`<button class="mbtn" id="R_${btoa(unescape(encodeURIComponent(w))).replace(/=/g,'')}" onclick="vmPick('R','${encodeURIComponent(w)}')">${w}</button>`).join('');
  app.innerHTML=`<div class="topbar"><span class="tag">${L.emoji} ${L.name} Match</span></div>
   <div class="sub">Tap a ${L.name} word, then its English meaning. Matched: <b>${VM.done}/${VM.pairs.length}</b></div>
   <div class="matchgrid"><div class="mcol">${lcol}</div><div class="mcol">${rcol}</div></div>
   <button class="btn ghost" onclick="sfx.click();matchMenu()">⬅️ Languages</button>`;
}
function vmId(side,w){return side+'_'+btoa(unescape(encodeURIComponent(w))).replace(/=/g,'');}
function vmPick(side,enc){const w=decodeURIComponent(enc);const el=document.getElementById(vmId(side,w));if(!el||el.classList.contains('done'))return;sfx.click();
  if(side==='L'){if(VM.selL){const p=document.getElementById(vmId('L',VM.selL));if(p)p.classList.remove('sel');}VM.selL=w;el.classList.add('sel');}
  else{if(VM.selR){const p=document.getElementById(vmId('R',VM.selR));if(p)p.classList.remove('sel');}VM.selR=w;el.classList.add('sel');}
  if(VM.selL&&VM.selR){VM.tries++;const correct=VM.pairs.some(p=>p[0]===VM.selL&&p[1]===VM.selR);
    const lEl=document.getElementById(vmId('L',VM.selL)),rEl=document.getElementById(vmId('R',VM.selR));
    if(correct){lEl.classList.add('done');rEl.classList.add('done');lEl.classList.remove('sel');rEl.classList.remove('sel');VM.done++;sfx.good();VM.selL=null;VM.selR=null;
      if(VM.done>=VM.pairs.length){sfx.win();setTimeout(()=>{app.querySelector('.sub').innerHTML='🎉 All matched! '+VM.pairs.length+' pairs in '+VM.tries+' tries.';},50);}}
    else{lEl.classList.add('bad');rEl.classList.add('bad');sfx.bad();const a=VM.selL,b=VM.selR;VM.selL=null;VM.selR=null;
      setTimeout(()=>{const x=document.getElementById(vmId('L',a)),y=document.getElementById(vmId('R',b));if(x&&!x.classList.contains('done')){x.classList.remove('bad','sel');}if(y&&!y.classList.contains('done')){y.classList.remove('bad','sel');}},600);}}
}

/* ---- Written Exam ---- */
let WR;
function writtenMenu(){let t='';Object.keys(WRITTEN).forEach(k=>{const em=(Object.values(SUBJECTS).find(s=>s.cat===k)||Object.values(LANG).find(s=>s.cat===k)||{emoji:'📝'}).emoji;t+=`<div class="tile" onclick="sfx.click();wrStart('${k}')"><div class="em">${em}</div><b>${k}</b></div>`;});
  app.innerHTML=`<div class="topbar"><span class="tag">📝 Written Exam</span></div><h2>Mark-scheme questions</h2><div class="sub">Type your answer, reveal the mark scheme, then mark yourself honestly.</div><div class="grid">${t}</div><button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>`;}
function wrStart(k){WR={k,list:WRITTEN[k],i:0,marks:0,max:WRITTEN[k].reduce((a,q)=>a+q.m,0)};wrQ();}
function wrQ(){if(WR.i>=WR.list.length)return wrResult();const q=WR.list[WR.i];
  app.innerHTML=`<div class="topbar"><span class="tag">📝 ${WR.k} ${WR.i+1}/${WR.list.length}</span></div>
   <div class="hud"><div class="stat"><b>${WR.marks}</b><span>Marks</span></div><div class="stat"><b>${q.m}</b><span>This Q</span></div></div>
   <div class="q">[${q.m} mark${q.m>1?'s':''}] ${q.q}</div>
   <textarea rows="4" placeholder="Write your answer (optional)..." style="width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:#11152a;color:var(--ink);font-size:15px;font-family:inherit"></textarea>
   <button class="btn" id="rev" onclick="wrReveal()">👀 Reveal mark scheme</button><div class="explain" id="ms"></div><div id="mk"></div>
   <button class="btn ghost" onclick="sfx.click();writtenMenu()">⬅️ Topics</button>`;}
function wrReveal(){const q=WR.list[WR.i];const ms=document.getElementById('ms');ms.innerHTML="<b>Mark scheme (1 mark per point):</b><ul style='margin:6px 0 0 18px'>"+q.s.map(p=>`<li style='margin:4px 0'>${p}</li>`).join('')+"</ul>";ms.style.display='block';document.getElementById('rev').style.display='none';sfx.click();
  let b='';for(let m=0;m<=q.m;m++)b+=`<button class="btn sm ${m===q.m?'green':'ghost'}" onclick="wrScore(${m})">${m}</button>`;document.getElementById('mk').innerHTML=`<div class="small" style="margin-top:10px">How many marks did you get?</div><div>${b}</div>`;}
function wrScore(m){WR.marks+=m;sfx.good();WR.i++;wrQ();}
function wrResult(){const pct=Math.round(WR.marks/WR.max*100);sfx.win();
  app.innerHTML=`<h1>📝 ${WR.marks}/${WR.max}</h1><div class="center" style="font-size:54px">${pct>=80?'🏆':pct>=50?'💪':'📚'}</div><div class="sub">${WR.k} • ${pct}%</div>
   <button class="btn" onclick="sfx.click();wrStart('${WR.k}')">🔁 Retry</button><button class="btn ghost" onclick="sfx.click();writtenMenu()">⬅️ Topics</button>`;}

/* ---- Final Exam ---- */
let FE;
function finalExam(){let all=[];Object.values(SUBJECTS).forEach(s=>s.qs.forEach(q=>all.push(Object.assign({cat:s.cat},q))));
  all=all.concat(vocabQs('french',5)).concat(vocabQs('spanish',5));shuffle(all);
  FE={qs:all.slice(0,25),i:0,correct:0,stat:{},answered:false};feRender();}
function feRender(){if(FE.i>=FE.qs.length)return feResult();FE.answered=false;const q=FE.qs[FE.i],prog=Math.round(FE.i/FE.qs.length*100);
  app.innerHTML=`<span class="cat" style="background:var(--accent2)">🎓 FINAL EXAM</span>
   <div class="hud"><div class="stat"><b>${FE.i+1}/${FE.qs.length}</b><span>Q</span></div><div class="stat"><b>${FE.correct}</b><span>Correct</span></div><div class="stat"><b>${FE.i?Math.round(FE.correct/FE.i*100):0}%</b><span>Running</span></div></div>
   <div class="bar"><i style="width:${prog}%"></i></div><span class="cat">${q.cat}</span><div class="q">${q.q}</div><div class="opts" id="opts"></div><div class="explain" id="explain"></div>
   <button class="btn" id="next" style="display:none" onclick="sfx.click();feNext()">NEXT ➡️</button>`;
  const opts=document.getElementById('opts');q.o.map((t,k)=>({t,k})).sort(()=>Math.random()-0.5).forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o.t;b.onclick=()=>feChoose(b,o.k===q.a,q);opts.appendChild(b);});}
function feChoose(btn,correct,q){if(FE.answered)return;FE.answered=true;FE.stat[q.cat]=FE.stat[q.cat]||{c:0,t:0};FE.stat[q.cat].t++;
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===q.o[q.a])b.classList.add('correct');else b.classList.add('dim');});
  const ex=document.getElementById('explain');ex.innerHTML=(correct?"✅ <b>Correct!</b> ":"❌ <b>Answer:</b> ")+q.w;ex.style.display='block';
  if(correct){FE.correct++;FE.stat[q.cat].c++;toast("✅");}else{btn.classList.remove('dim');btn.classList.add('wrong');toast("❌");}
  const n=document.getElementById('next');n.style.display='block';if(FE.i>=FE.qs.length-1)n.textContent='🏁 FINISH';}
function feNext(){FE.i++;feRender();}
function feResult(){const sc=loadScores();for(const c in FE.stat){const p=Math.round(FE.stat[c].c/FE.stat[c].t*100);if(sc[c]==null||p>=sc[c])sc[c]=p;}localStorage.setItem('sq_scores',JSON.stringify(sc));
  const pct=Math.round(FE.correct/FE.qs.length*100);let g,gm;
  if(pct>=90){g="Grade 9 🏆";gm="🧠✨";}else if(pct>=80){g="Grade 8";gm="📈🔥";}else if(pct>=70){g="Grade 7";gm="💪";}else if(pct>=55){g="Grade 5–6";gm="👍";}else if(pct>=40){g="Grade 4";gm="🛠️";}else{g="Below pass";gm="📚";}
  const ranked=Object.keys(FE.stat).map(c=>({c,p:Math.round(FE.stat[c].c/FE.stat[c].t*100)})).sort((a,b)=>a.p-b.p);
  const rows=ranked.map(r=>{const col=r.p>=80?'var(--good)':r.p>=50?'var(--accent)':'var(--accent2)';return `<div class="report-row"><div class="name">${r.c}</div><div class="track"><i style="width:${r.p}%;background:${col}"></i></div><div class="pct" style="color:${col}">${r.p}%</div></div>`;}).join('');
  app.innerHTML=`<h1>🎓 FINAL EXAM</h1><div class="center" style="font-size:50px">${gm}</div>
   <div class="hud"><div class="stat"><b>${FE.correct}/${FE.qs.length}</b><span>Score</span></div><div class="stat"><b>${pct}%</b><span>%</span></div><div class="stat"><b>${g}</b><span>Grade</span></div></div>
   <h3 style="color:var(--accent);margin:8px 0 4px">By subject (weakest first):</h3>${rows}
   <button class="btn" onclick="sfx.click();finalExam()">🔁 Retake</button><button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>`;}

/* ---- Gap Report ---- */
function gapReport(){const s=loadScores();const cats=['Maths','Geography','RS','Computing','French','Spanish'];
  const ranked=cats.map(c=>({c,p:s[c]})).filter(x=>x.p!=null).sort((a,b)=>a.p-b.p);
  const rows=ranked.map(r=>{const col=r.p>=80?'var(--good)':r.p>=50?'var(--accent)':'var(--accent2)';return `<div class="report-row"><div class="name">${r.c}</div><div class="track"><i style="width:${r.p}%;background:${col}"></i></div><div class="pct" style="color:${col}">${r.p}%</div></div>`;}).join('');
  const weak=ranked.filter(r=>r.p<70).map(r=>r.c);
  app.innerHTML=`<h1>📊 Gap Report</h1><div class="sub">${ranked.length}/6 subjects attempted</div>${rows||'<p class="small center">Beat some bosses first!</p>'}
   ${weak.length?`<div class="info" style="margin-top:12px"><b>🎯 Revise these first:</b> ${weak.join(', ')}.</div>`:(ranked.length?'<div class="info" style="margin-top:12px">🎉 Every attempted subject ≥70%!</div>':'')}
   <button class="btn ghost" onclick="sfx.click();map()">🗺️ Map</button>`;}

home();
</script>
